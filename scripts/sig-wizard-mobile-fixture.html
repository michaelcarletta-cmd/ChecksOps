<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Signature wizard mobile fixture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; background: #0f172a; font-family: ui-sans-serif, system-ui, sans-serif; }
    .phone-frame { background: #020617; min-height: 100vh; }
    button { white-space: nowrap; }
  </style>
</head>
<body>
  <div id="app" class="phone-frame p-2"></div>
  <script>
    const params = new URLSearchParams(location.search);
    const step = Number(params.get("step") || "3");
    const signers = Number(params.get("signers") || "1");
    const desktop = params.get("desktop") === "1";
    const width = Number(params.get("width") || "390");
    document.getElementById("app").style.width = width + "px";
    document.getElementById("app").style.maxWidth = width + "px";
    document.getElementById("app").style.margin = "0 auto";

    const signerRow = (index) => `
      <div class="flex min-w-0 items-start gap-2">
        <div class="grid min-w-0 flex-1 grid-cols-1 gap-2 sm:grid-cols-3">
          <input class="h-10 w-full rounded-md border px-3 text-sm" placeholder="Name" value="${index === 0 ? "Michael Carletta" : "Second Signer"}" />
          <input class="h-10 w-full rounded-md border px-3 text-sm" placeholder="Email" value="${index === 0 ? "michaelcarletta@gmail.com" : "second@example.com"}" />
          <select class="h-10 w-full rounded-md border px-3 text-sm"><option>Policyholder</option></select>
        </div>
        ${signers > 1 ? '<button class="h-10 w-10 shrink-0 rounded-md border">X</button>' : ""}
      </div>`;

    const stepBody = () => {
      if (step === 1) {
        return `
          <div class="min-w-0 space-y-4">
            <label class="block text-sm font-medium">Document Source</label>
            <select class="h-10 w-full rounded-md border px-3 text-sm">
              <option>Use Existing Claim/Check File</option>
            </select>
            <label class="block text-sm font-medium">Existing file (PDF or DOCX)</label>
            <select class="h-10 w-full rounded-md border px-3 text-sm">
              <option>Select a file from claim/check files</option>
              <option>Third-Party-Auth-Form.pdf</option>
            </select>
          </div>`;
      }
      if (step === 2) {
        return `
          <div class="min-w-0 overflow-x-hidden">
            <div class="grid grid-cols-2 gap-2 sm:flex">
              <button class="rounded-md border px-3 py-2 text-sm">Add Signature</button>
              <button class="rounded-md border px-3 py-2 text-sm">Add Date</button>
            </div>
            <div class="mt-3 mx-auto bg-white border" style="width:100%;max-width:600px;aspect-ratio:8.5/11"></div>
          </div>`;
      }
      return `
        <div class="min-w-0 space-y-3">
          <div class="flex min-w-0 flex-wrap items-center justify-between gap-2">
            <label class="min-w-0 text-sm font-medium">Signers (in order)</label>
            <button class="shrink-0 rounded-md border px-3 py-2 text-sm">Add Signer</button>
          </div>
          ${Array.from({ length: signers }, (_, i) => signerRow(i)).join("")}
        </div>`;
    };

    const footer = () => {
      if (step === 3) {
        return `
          <button class="w-full sm:w-auto rounded-md border px-4 py-2 text-sm">Generate Link Only</button>
          <button class="w-full sm:w-auto rounded-md bg-slate-900 px-4 py-2 text-sm text-white">Send for Signature</button>`;
      }
      return `<button class="w-full sm:w-auto rounded-md bg-slate-900 px-4 py-2 text-sm text-white">Next</button>`;
    };

    document.getElementById("app").innerHTML = `
      <div data-dialog class="relative mx-auto grid w-[calc(100%-2rem)] max-w-4xl min-w-0 gap-4 overflow-x-hidden overflow-y-auto rounded-lg border bg-white p-4 text-slate-900 shadow-lg sm:p-6 ${desktop ? "max-w-4xl" : ""}">
        <button class="absolute right-4 top-4 text-slate-500" aria-label="Close">✕</button>
        <header class="min-w-0 space-y-1.5 pr-8 text-left">
          <h2 class="text-base leading-snug break-words sm:text-lg font-semibold">Create Signature Request - Step ${step} of 3</h2>
          <p class="text-left text-sm text-slate-500">${step === 1 ? "Select a document source" : step === 2 ? "Place signature and date fields on the document" : "Configure signers"}</p>
        </header>
        ${stepBody()}
        <footer class="sticky bottom-0 z-10 min-w-0 bg-white pt-2">
          <div class="flex w-full min-w-0 flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
            ${step > 1 ? '<div class="flex w-full min-w-0 sm:w-auto"><button class="w-full sm:w-auto rounded-md border px-4 py-2 text-sm">Back</button></div>' : '<div></div>'}
            <div class="flex w-full min-w-0 flex-col gap-2 sm:w-auto sm:flex-row sm:justify-end">
              ${footer()}
            </div>
          </div>
        </footer>
      </div>
      <pre id="proof" class="sr-only" style="position:absolute;left:-9999px"></pre>`;
    requestAnimationFrame(() => {
      const phone = document.getElementById("app");
      const dialog = document.querySelector("[data-dialog]");
      const title = document.querySelector("h2");
      const box = dialog.getBoundingClientRect();
      const phoneBox = phone.getBoundingClientRect();
      const buttons = [...dialog.querySelectorAll("button")].map((el) => {
        const r = el.getBoundingClientRect();
        return {
          text: el.textContent.trim(),
          right: Math.round(r.right),
          top: Math.round(r.top),
          width: Math.round(r.width),
          inside: r.right <= box.right + 1 && r.left >= box.left - 1 && r.right <= phoneBox.right + 1,
        };
      });
      const report = {
        step,
        signers,
        requestedWidth: width,
        viewport: width,
        phoneWidth: Math.round(phoneBox.width),
        dialogWidth: Math.round(box.width),
        dialogRight: Math.round(box.right),
        dialogInsidePhone: box.right <= phoneBox.right + 1 && box.left >= phoneBox.left - 1,
        overflowX: dialog.scrollWidth > dialog.clientWidth + 1 || phone.scrollWidth > phone.clientWidth + 1,
        title: title.textContent,
        titleFullyVisible: title.scrollWidth <= title.clientWidth + 1,
        buttonsInside: buttons.every((b) => b.inside),
        buttons,
      };
      document.getElementById("proof").textContent = JSON.stringify(report);
    });
  </script>
</body>
</html>
