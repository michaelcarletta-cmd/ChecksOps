name: Production Moov status catch-up

# Runbook ops/moov-status-catch-up.md. Invokes the Moov status catch-up inside the production API
# Lambda checksops-production-prep-api (a direct invocation, no HTTP route) with the dedicated role
# ChecksOpsGitHubProductionMoovStatusCatchUp (ops/deployment-guard/production-moov-status-catch-up/),
# whose only permission is lambda:InvokeFunction on that function.
# plan is read-only and prints counts, manifest_sha256 and transfer_ids. apply runs only with that
# plan's manifest_sha256 and transfer_ids, the same limit, and the owner's phrase for that plan:
#   apply the Moov catch-up plan <manifest_sha256> in production
# It plans again first and stops before any write unless the fresh plan is the reviewed one.
# Every run waits for the production environment reviewer (the owner).
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "plan (read-only) or apply (writes the reviewed plan)"
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      actor_application_user_id:
        description: "The platform owner's application user id (public.is_platform_owner() must be true for it)"
        required: true
        type: string
      limit:
        description: "Candidate limit, 1 to 200 (apply: the same limit as the reviewed plan)"
        required: false
        default: "50"
        type: string
      approval_phrase:
        description: "apply only: apply the Moov catch-up plan <manifest_sha256> in production"
        required: false
        default: ""
        type: string
      manifest_sha256:
        description: "apply only: manifest_sha256 from the reviewed plan run"
        required: false
        default: ""
        type: string
      transfer_ids:
        description: "apply only: transfer_ids from the reviewed plan run, comma separated"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-moov-status-catch-up
  cancel-in-progress: false

jobs:
  production-moov-status-catch-up:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse non-main or incomplete apply
        shell: bash
        # Inputs reach the script only through env, never as interpolated shell source.
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_ACTOR: ${{ inputs.actor_application_user_id }}
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          INPUT_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          INPUT_TRANSFER_IDS: ${{ inputs.transfer_ids }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Production Moov status catch-up only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          [[ "$INPUT_ACTOR" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || { echo "actor_application_user_id must be a uuid"; exit 2; }
          [[ "$INPUT_LIMIT" =~ ^[1-9][0-9]{0,2}$ ]] && [ "$INPUT_LIMIT" -le 200 ] || { echo "limit must be 1 to 200"; exit 2; }
          case "$INPUT_PHASE" in
            plan)
              test -z "$INPUT_APPROVAL_PHRASE$INPUT_MANIFEST_SHA256$INPUT_TRANSFER_IDS" || { echo "plan takes no approval_phrase, manifest_sha256 or transfer_ids"; exit 2; }
              ;;
            apply)
              [[ "$INPUT_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "apply requires manifest_sha256 from the reviewed plan run"; exit 2; }
              test -n "$INPUT_TRANSFER_IDS" || { echo "apply requires transfer_ids from the reviewed plan run"; exit 2; }
              PHRASE="apply the Moov catch-up plan $INPUT_MANIFEST_SHA256 in production"
              test "$INPUT_APPROVAL_PHRASE" = "$PHRASE" || { echo "approval_phrase must be exactly: $PHRASE"; exit 2; }
              ;;
            *) echo "phase must be plan or apply"; exit 2 ;;
          esac

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run safety tests
        run: |
          node --experimental-strip-types --test aws/tests/github-production-moov-status-catch-up.test.mjs
          node --experimental-strip-types --test aws/tests/moov-status-catch-up.test.mjs

      - name: Validate production OIDC inputs
        shell: bash
        env:
          PRODUCTION_MOOV_STATUS_CATCH_UP_ROLE_ARN: ${{ vars.CHECKSOPS_PRODUCTION_MOOV_STATUS_CATCH_UP_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_MOOV_STATUS_CATCH_UP_ROLE_ARN" = "arn:aws:iam::806168576068:role/ChecksOpsGitHubProductionMoovStatusCatchUp" || { echo "CHECKSOPS_PRODUCTION_MOOV_STATUS_CATCH_UP_ROLE_ARN must be the dedicated production Moov status catch-up role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide an OIDC request URL"; exit 2; }

      - name: Configure production catch-up session (invoke only)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_PRODUCTION_MOOV_STATUS_CATCH_UP_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-production-moov-status-catch-up-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["lambda:InvokeFunction"],"Resource":["arn:aws:lambda:us-east-1:806168576068:function:checksops-production-prep-api","arn:aws:lambda:us-east-1:806168576068:function:checksops-production-prep-api:$LATEST"]}]}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubProductionMoovStatusCatchUp/checksops-production-moov-status-catch-up-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Invoke the catch-up in the production API Lambda
        shell: bash
        env:
          CHECKSOPS_CATCH_UP_PHASE: ${{ inputs.phase }}
          CHECKSOPS_CATCH_UP_ACTOR_APPLICATION_USER_ID: ${{ inputs.actor_application_user_id }}
          CHECKSOPS_CATCH_UP_LIMIT: ${{ inputs.limit }}
          CHECKSOPS_CATCH_UP_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
          CHECKSOPS_CATCH_UP_MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
          CHECKSOPS_CATCH_UP_TRANSFER_IDS: ${{ inputs.transfer_ids }}
        run: node scripts/deployment-guard/github-production-moov-status-catch-up.mjs
