# M6.3A: deploy ONLY aws-staging-db-bridge to production project nbcqwpysqgyxrrbgtmkw.
#
# Secret sources are tried in order. --project-ref is always production.
# This workflow must never deploy other functions, prune, or retarget.
name: M6.3A db-bridge recipient_session_resolve

on:
  push:
    branches:
      - cursor/moov-m63-recipient-session-reads-a508
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moov-m63a-db-bridge-deploy
  cancel-in-progress: false

jobs:
  deploy-from-repo-secret:
    name: Deploy with repo SUPABASE_ACCESS_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' || env.SUPABASE_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy aws-staging-db-bridge only
        id: result
        run: |
          set -euo pipefail
          TOKEN="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SUPABASE_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Repo secrets SUPABASE_ACCESS_TOKEN/SUPABASE_TOKEN are empty."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          chmod +x scripts/m63a-deploy-db-bridge.sh
          scripts/m63a-deploy-db-bridge.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  deploy-from-production-secret:
    name: Deploy with Production environment token
    needs: deploy-from-repo-secret
    if: needs.deploy-from-repo-secret.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' || env.SUPABASE_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy aws-staging-db-bridge only
        id: result
        run: |
          set -euo pipefail
          unset SUPABASE_PROJECT_ID || true
          TOKEN="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SUPABASE_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Production environment has no SUPABASE_ACCESS_TOKEN/SUPABASE_TOKEN."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          chmod +x scripts/m63a-deploy-db-bridge.sh
          scripts/m63a-deploy-db-bridge.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  require-token:
    name: Require a management token
    needs: [deploy-from-repo-secret, deploy-from-production-secret]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if nothing deployed
        run: |
          set -euo pipefail
          repo='${{ needs.deploy-from-repo-secret.outputs.deployed }}'
          prod='${{ needs.deploy-from-production-secret.outputs.deployed }}'
          echo "repo=$repo production=$prod"
          if [ "$repo" = "true" ] || [ "$prod" = "true" ]; then
            echo "aws-staging-db-bridge deploy succeeded."
            exit 0
          fi
          echo "::error::No production-scoped Supabase management PAT found in repo or Production secrets. Add SUPABASE_ACCESS_TOKEN (sbp_...) with access to nbcqwpysqgyxrrbgtmkw, or deploy aws-staging-db-bridge from the Lovable connected-Supabase path. Do not deploy other Edge functions."
          exit 1
