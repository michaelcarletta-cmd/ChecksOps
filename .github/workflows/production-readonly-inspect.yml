name: Production read-only fingerprint inspection

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-readonly-inspect
  cancel-in-progress: false

jobs:
  inspect:
    environment: production-readonly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact current main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require current main and unchanged workflow source
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Inspection is only permitted from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          git fetch --no-tags --depth=1 origin main
          test "$(git rev-parse FETCH_HEAD)" = "$GITHUB_SHA" || { echo "main moved; restart inspection from its current commit"; exit 2; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Install locked runtime dependencies without lifecycle scripts
        run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund

      - name: Validate the dedicated read-only AWS role
        shell: bash
        env:
          INSPECT_ROLE_ARN: ${{ vars.CHECKSOPS_PRODUCTION_READONLY_INSPECT_ROLE_ARN }}
        run: |
          set -euo pipefail
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubProductionReadOnlyInspect"
          test "$INSPECT_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "Production read-only inspection role is not configured as expected"; exit 2; }

      - name: Assume narrowly scoped read-only inspection role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_PRODUCTION_READONLY_INSPECT_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-production-readonly-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[
              {"Effect":"Allow","Action":["lambda:GetFunction","lambda:GetFunctionConfiguration","lambda:ListAliases"],"Resource":["arn:aws:lambda:us-east-1:806168576068:function:checksops-production-prep-api","arn:aws:lambda:us-east-1:806168576068:function:checksops-production-prep-api:*"]},
              {"Effect":"Allow","Action":["apigateway:GET"],"Resource":"arn:aws:apigateway:us-east-1::/apis/kiqojucc02/*"},
              {"Effect":"Allow","Action":["cloudfront:GetDistribution"],"Resource":"arn:aws:cloudfront::806168576068:distribution/E1B0ZWWO5559U5"},
              {"Effect":"Allow","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::checksops-production-frontend-806168576068/index.html","arn:aws:s3:::checksops-production-frontend-806168576068/assets/index-*.js"]}
            ]}

      - name: Verify read-only AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ACCOUNT" = "806168576068" || { echo "Unexpected AWS account"; exit 2; }
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubProductionReadOnlyInspect/checksops-production-readonly-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Inspect production without invoking application operations
        env:
          CHECKSOPS_PRODUCTION_INSPECT_DATABASE_URL: ${{ secrets.CHECKSOPS_PRODUCTION_INSPECT_DATABASE_URL }}
        run: node scripts/deployment-guard/production-readonly-inspect.mjs > "$RUNNER_TEMP/production-readonly-report.json"

      - name: Publish redacted inspection summary
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const reportPath = `${process.env.RUNNER_TEMP}/production-readonly-report.json`;
          if (!fs.existsSync(reportPath)) throw new Error('Inspector report was not produced.');
          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          const summary = [
            '### Production read-only inspection',
            `- Generated: \`${report.generated_at}\``,
            `- Main SHA: \`${report.current_main_sha}\``,
            `- SPA status / entry / index SHA-256 / bundle SHA-256: \`${report.spa?.status ?? report.status ?? 'unknown'}\` / \`${report.spa?.live?.entry ?? 'unknown'}\` / \`${report.spa?.live?.index_sha256 ?? 'unknown'}\` / \`${report.spa?.live?.bundle_sha256 ?? 'unknown'}\``,
            `- API/Lambda status / version / CodeSha256: \`${report.api_lambda?.status ?? 'unknown'}\` / \`${report.api_lambda?.lambda?.version ?? 'unknown'}\` / \`${report.api_lambda?.lambda?.code_sha256 ?? 'unknown'}\``,
            `- Relevant feature flags: \`${JSON.stringify(report.api_lambda?.flags ?? {})}\``,
            `- Repair liveness: \`${JSON.stringify(report.api_lambda?.repairs ?? {})}\``,
            `- Database status / SQL52 / SQL53 / endorsement trigger: \`${report.database?.status ?? 'unknown'}\` / \`${JSON.stringify(report.database?.sql52 ?? {})}\` / \`${JSON.stringify(report.database?.sql53 ?? {})}\` / \`${JSON.stringify(report.database?.endorsement_trigger ?? {})}\``,
            `- Generic claim_settlements writes blocked: \`${report.database?.generic_claim_settlements_writes_blocked ?? 'unknown'}\``,
            `- Drift: \`${JSON.stringify(report.drift)}\``,
            `- Minimum missing mutations: \`${JSON.stringify(report.minimum_missing_mutations)}\``,
            `- Acceptance required before promotion: \`${JSON.stringify(report.acceptance_required_before_promotion ?? [])}\``,
            `- SAFE-TO-AUTHORIZE: **${report['SAFE-TO-AUTHORIZE']}**`,
            '',
          ].join('\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE
