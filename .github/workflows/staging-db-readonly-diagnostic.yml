name: Staging DB read-only diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-db-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Refuse unreviewed workflow sources
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Diagnostic requires reviewed main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'

      - name: Install existing JWT verifier dependencies (no lifecycle scripts)
        run: npm ci --prefix aws/functions/api --ignore-scripts --no-audit --no-fund

      - name: Test diagnostic offline
        run: node --test aws/tests/staging-db-readonly-diagnostic.test.mjs

      - name: Explain authentication prerequisite
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          ### Staging diagnostic: authentication setup required
          No approved non-interactive staging Cognito identity mechanism is configured.
          This run fails closed before contacting Cognito or the diagnostic API.
          Do not extract or supply a token, OTP, password, or refresh token.
          Environment approval authorizes this job; it does not create a Cognito session.
          See [secure setup and phone-only steps](https://github.com/michaelcarletta-cmd/ChecksOps/blob/main/aws/README.md#authenticated-staging-validation-diagnostic).
          SUMMARY

      - name: Fail closed until protected authentication is approved
        run: node scripts/staging-db-readonly-diagnostic.mjs
