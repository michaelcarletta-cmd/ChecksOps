name: Guarded staging Lambda overlay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect live staging state or apply a guarded overlay"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      operation:
        description: "Apply operation: explicitly ADD an absent member or REPLACE a reviewed live member"
        required: true
        default: replace
        type: choice
        options:
          - replace
          - add
      member:
        description: "Single repository Lambda ZIP member to inspect/add/replace"
        required: true
        default: index.mjs
        type: string
      approved_commit:
        description: "Required for apply: exact main commit approved for deployment"
        required: false
        default: ""
        type: string
      expected_live_member_sha256:
        description: "Required for REPLACE apply: exact live member SHA-256 from a prior inspect run"
        required: false
        default: ""
        type: string
      accept_public_validator_unhealthy:
        description: "Owner-selected only. Default false. Accept the known redacted public /db-readonly-validate HTTP 503 while replacing db-readonly-validate.mjs. Never inferred. Does not mark the database healthy."
        required: true
        default: false
        type: boolean
      export_live_member:
        description: "Inspect only. Default false. Upload the live .mjs/.js member's exact bytes (re-hashed against the inspected SHA-256, refused if it carries key material) as a 1-day artifact for source reconciliation. Never writes to AWS."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: guarded-staging-lambda-overlay
  cancel-in-progress: false

jobs:
  staging-overlay:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Refuse non-main or unapproved apply
        shell: bash
        # Inputs reach the script only through env, never as interpolated shell source.
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_MEMBER: ${{ inputs.member }}
          INPUT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          INPUT_EXPECTED_LIVE_MEMBER_SHA256: ${{ inputs.expected_live_member_sha256 }}
          INPUT_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY: ${{ inputs.accept_public_validator_unhealthy }}
          INPUT_EXPORT_LIVE_MEMBER: ${{ inputs.export_live_member }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded staging deploy only runs from main"; exit 2; }
          if [ "$INPUT_EXPORT_LIVE_MEMBER" = "true" ]; then
            test "$INPUT_MODE" = "inspect" || { echo "export_live_member is inspect-only"; exit 2; }
          fi
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          if [ "$INPUT_MODE" = "apply" ]; then
            test -n "$INPUT_APPROVED_COMMIT" || { echo "apply requires approved_commit"; exit 2; }
            [[ "$INPUT_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "approved_commit must be a 40-character commit SHA"; exit 2; }
            test "$INPUT_APPROVED_COMMIT" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            if [ "$INPUT_OPERATION" = "replace" ]; then
              test -n "$INPUT_EXPECTED_LIVE_MEMBER_SHA256" || { echo "REPLACE apply requires expected_live_member_sha256 from inspect"; exit 2; }
              [[ "$INPUT_EXPECTED_LIVE_MEMBER_SHA256" =~ ^[0-9a-fA-F]{64}$ ]] || { echo "expected_live_member_sha256 must be 64 hex characters"; exit 2; }
            fi
          fi
          if [ "$INPUT_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY" = "true" ]; then
            test "$INPUT_MEMBER" = "db-readonly-validate.mjs" || { echo "accept_public_validator_unhealthy is limited to replace db-readonly-validate.mjs on checksops-staging-api"; exit 2; }
            test "$INPUT_OPERATION" = "replace" || { echo "accept_public_validator_unhealthy is limited to replace db-readonly-validate.mjs on checksops-staging-api"; exit 2; }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Refuse unscoped validator-unhealthy exception
        shell: bash
        env:
          CHECKSOPS_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY: ${{ inputs.accept_public_validator_unhealthy }}
          CHECKSOPS_STAGING_OVERLAY_MEMBER: ${{ inputs.member }}
          CHECKSOPS_STAGING_OVERLAY_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { validateAcceptPublicValidatorUnhealthy } from './scripts/deployment-guard/github-staging-lambda-overlay.mjs';
          const result = validateAcceptPublicValidatorUnhealthy({
            accept: process.env.CHECKSOPS_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY,
            member: process.env.CHECKSOPS_STAGING_OVERLAY_MEMBER,
            operation: process.env.CHECKSOPS_STAGING_OVERLAY_OPERATION,
            functionName: 'checksops-staging-api',
          });
          if (!result.ok) {
            console.error(result.message);
            process.exit(2);
          }
          NODE

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/github-staging-lambda-overlay.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node --test aws/tests/lambda-overlay-apply-writer.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs

      - name: Validate staging OIDC inputs
        shell: bash
        env:
          STAGING_DEPLOY_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubStagingLambdaOverlay"
          test -n "$STAGING_DEPLOY_ROLE_ARN" || { echo "CHECKSOPS_STAGING_DEPLOY_ROLE_ARN is not available to the staging environment job"; exit 2; }
          test "$STAGING_DEPLOY_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "CHECKSOPS_STAGING_DEPLOY_ROLE_ARN does not match the dedicated staging deploy role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_URL despite id-token: write"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_TOKEN despite id-token: write"; exit 2; }
          echo "Staging role ARN and GitHub OIDC request context are present."

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-overlay-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        env:
          STAGING_DEPLOY_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "$STAGING_DEPLOY_ROLE_ARN" || { echo "staging deploy role variable is missing"; exit 2; }

      - name: Load staging KMS verifier
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          test -n "$KMS_KEY_ARN" || { echo "staging deployment-guard KMS key ARN is missing"; exit 2; }
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:*:key/*) ;;
            *) echo "invalid staging deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
          } >> "$GITHUB_ENV"

      - name: Inspect and authorize exact live member
        id: preflight
        shell: bash
        env:
          CHECKSOPS_STAGING_DEPLOY_MODE: ${{ inputs.mode }}
          CHECKSOPS_STAGING_OVERLAY_OPERATION: ${{ inputs.operation }}
          CHECKSOPS_STAGING_OVERLAY_MEMBER: ${{ inputs.member }}
          CHECKSOPS_EXPECTED_LIVE_MEMBER_SHA256: ${{ inputs.expected_live_member_sha256 }}
          CHECKSOPS_STAGING_EXPORT_LIVE_MEMBER_DIR: ${{ inputs.export_live_member && format('{0}/live-member-export', runner.temp) || '' }}
        run: node scripts/deployment-guard/github-staging-lambda-overlay.mjs

      - name: Upload exported live member (inspect only)
        if: ${{ inputs.mode == 'inspect' && inputs.export_live_member }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-live-member-${{ github.run_id }}
          path: ${{ steps.preflight.outputs.exported_member_file }}
          if-no-files-found: error
          retention-days: 1

      - name: Record inspected live state
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_OPERATION: ${{ inputs.operation }}
          INPUT_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY: ${{ inputs.accept_public_validator_unhealthy }}
          OWNED_MEMBER: ${{ steps.preflight.outputs.owned_member }}
          LIVE_CODE_SHA256: ${{ steps.preflight.outputs.live_code_sha256 }}
          LIVE_REVISION_ID: ${{ steps.preflight.outputs.live_revision_id }}
          LIVE_MEMBER_STATE: ${{ steps.preflight.outputs.live_member_state }}
          LIVE_MEMBER_SHA256: ${{ steps.preflight.outputs.live_member_sha256 }}
          EXPORTED_MEMBER_SHA256: ${{ steps.preflight.outputs.exported_member_sha256 }}
        run: |
          {
            echo "### Staging Lambda overlay preflight"
            echo "- Mode: \`$INPUT_MODE\`"
            echo "- Operation: \`$INPUT_OPERATION\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Member: \`$OWNED_MEMBER\`"
            echo "- Live CodeSha256: \`$LIVE_CODE_SHA256\`"
            echo "- Live RevisionId: \`$LIVE_REVISION_ID\`"
            echo "- Live member state: \`$LIVE_MEMBER_STATE\`"
            echo "- Live member SHA-256: \`$LIVE_MEMBER_SHA256\`"
            echo "- Exported live member SHA-256: \`$EXPORTED_MEMBER_SHA256\`"
            echo "- Accept public validator unhealthy: \`$INPUT_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply through official receipt-gated overlay writer
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          CHECKSOPS_COMMIT: ${{ github.sha }}
          CHECKSOPS_BRANCH: main
          CHECKSOPS_OPERATOR: ${{ github.actor }}
          OVERLAY_INPUT: ${{ steps.preflight.outputs.overlay_input }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/lambda-overlay-apply.mjs --apply --input "$OVERLAY_INPUT"

      - name: Public staging smoke (inspect or post-deploy)
        shell: bash
        env:
          CHECKSOPS_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY: ${{ inputs.accept_public_validator_unhealthy }}
          CHECKSOPS_STAGING_OVERLAY_MEMBER: ${{ inputs.member }}
          CHECKSOPS_STAGING_OVERLAY_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://psr19uhop4.execute-api.us-east-1.amazonaws.com/staging';
          const acceptRequested=process.env.CHECKSOPS_ACCEPT_PUBLIC_VALIDATOR_UNHEALTHY === 'true';
          const overlayMember=process.env.CHECKSOPS_STAGING_OVERLAY_MEMBER || '';
          const overlayOperation=process.env.CHECKSOPS_STAGING_OVERLAY_OPERATION || '';
          if (acceptRequested && (overlayMember !== 'db-readonly-validate.mjs' || overlayOperation !== 'replace')) {
            throw new Error('accept_public_validator_unhealthy is limited to replace db-readonly-validate.mjs on checksops-staging-api');
          }
          const acceptUnhealthy=acceptRequested && overlayMember === 'db-readonly-validate.mjs' && overlayOperation === 'replace';
          async function get(path,allowedKeys,options={}) {
            const res=await fetch(base+path,{method:'GET',headers:{accept:'application/json'},signal:AbortSignal.timeout(20000)});
            const text=await res.text();
            let body={};
            try { body=JSON.parse(text); } catch {}
            const jsonObject=body !== null && typeof body === 'object' && !Array.isArray(body);
            const status=jsonObject && Object.hasOwn(body,'status')
              ? (['ok','unhealthy'].includes(body.status) ? body.status : 'unexpected')
              : 'missing';
            const redacted=jsonObject && (!allowedKeys || Object.keys(body).every(key=>allowedKeys.includes(key)));
            console.log(JSON.stringify({path,httpStatus:res.status,jsonObject,status,redacted}));
            const exactUnhealthy=options.allowUnhealthy === true && res.status === 503 && redacted
              && jsonObject && Object.keys(body).length === 3
              && body.service === 'checksops-api' && body.status === 'unhealthy' && body.readOnly === true;
            if (exactUnhealthy) return { body, knownUnhealthyDiagnostic: true };
            if (res.status !== 200) throw new Error(path+' expected 200, got '+res.status);
            if (!redacted) throw new Error(path+' unexpected response shape (body withheld)');
            return { body, knownUnhealthyDiagnostic: false };
          }
          const health=await get('/health');
          if (health.body.status !== 'ok') throw new Error('/health not ok');
          const db=await get('/db-health',['service','status']);
          if (db.body.status !== 'ok') throw new Error('/db-health not ok');
          const validation=await get('/db-readonly-validate',['service','status','readOnly'],{allowUnhealthy:acceptUnhealthy});
          if (validation.knownUnhealthyDiagnostic) {
            console.log(JSON.stringify({health:'ok',dbHealth:'redacted-ok',dbReadonlyValidate:'known-unhealthy-diagnostic'}));
          } else {
            if (validation.body.status !== 'ok' || validation.body.readOnly !== true) throw new Error('/db-readonly-validate not healthy/read-only');
            console.log(JSON.stringify({health:'ok',dbHealth:'redacted-ok',dbReadonlyValidate:'redacted-ok'}));
          }
          NODE
          {
            echo "### Public staging smoke"
            echo "- /health and /db-health still required HTTP 200"
            echo "- An accepted public validator 503 is \`known-unhealthy-diagnostic\`, not a healthy database"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        shell: bash
        run: rm -rf .deployment-guard
