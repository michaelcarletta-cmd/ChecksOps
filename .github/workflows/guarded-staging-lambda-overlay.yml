name: Guarded staging Lambda overlay

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Inspect live staging state or apply a guarded overlay"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      operation:
        description: "Apply operation: explicitly ADD an absent member or REPLACE a reviewed live member"
        required: true
        default: replace
        type: choice
        options:
          - replace
          - add
      member:
        description: "Single repository Lambda ZIP member to inspect/add/replace"
        required: true
        default: index.mjs
        type: string
      approved_commit:
        description: "Required for apply: exact main commit approved for deployment"
        required: false
        default: ""
        type: string
      expected_live_member_sha256:
        description: "Required for REPLACE apply: exact live member SHA-256 from a prior inspect run"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: guarded-staging-lambda-overlay
  cancel-in-progress: false

jobs:
  staging-overlay:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Refuse non-main or unapproved apply
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded staging deploy only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          if [ "${{ inputs.mode }}" = "apply" ]; then
            test -n "${{ inputs.approved_commit }}" || { echo "apply requires approved_commit"; exit 2; }
            test "${{ inputs.approved_commit }}" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            if [ "${{ inputs.operation }}" = "replace" ]; then
              test -n "${{ inputs.expected_live_member_sha256 }}" || { echo "REPLACE apply requires expected_live_member_sha256 from inspect"; exit 2; }
            fi
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/github-staging-lambda-overlay.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node --test aws/tests/lambda-overlay-apply-writer.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs

      - name: Validate staging OIDC inputs
        shell: bash
        env:
          STAGING_DEPLOY_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubStagingLambdaOverlay"
          test -n "$STAGING_DEPLOY_ROLE_ARN" || { echo "CHECKSOPS_STAGING_DEPLOY_ROLE_ARN is not available to the staging environment job"; exit 2; }
          test "$STAGING_DEPLOY_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "CHECKSOPS_STAGING_DEPLOY_ROLE_ARN does not match the dedicated staging deploy role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_URL despite id-token: write"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_TOKEN despite id-token: write"; exit 2; }
          echo "Staging role ARN and GitHub OIDC request context are present."

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-overlay-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          test -n "${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}" || { echo "staging deploy role variable is missing"; exit 2; }

      - name: Load staging KMS verifier
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          test -n "$KMS_KEY_ARN" || { echo "staging deployment-guard KMS key ARN is missing"; exit 2; }
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:*:key/*) ;;
            *) echo "invalid staging deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
          } >> "$GITHUB_ENV"

      - name: Inspect and authorize exact live member
        id: preflight
        shell: bash
        env:
          CHECKSOPS_STAGING_DEPLOY_MODE: ${{ inputs.mode }}
          CHECKSOPS_STAGING_OVERLAY_OPERATION: ${{ inputs.operation }}
          CHECKSOPS_STAGING_OVERLAY_MEMBER: ${{ inputs.member }}
          CHECKSOPS_EXPECTED_LIVE_MEMBER_SHA256: ${{ inputs.expected_live_member_sha256 }}
        run: node scripts/deployment-guard/github-staging-lambda-overlay.mjs

      - name: Record inspected live state
        shell: bash
        run: |
          {
            echo "### Staging Lambda overlay preflight"
            echo "- Mode: \`${{ inputs.mode }}\`"
            echo "- Operation: \`${{ inputs.operation }}\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Member: \`${{ steps.preflight.outputs.owned_member }}\`"
            echo "- Live CodeSha256: \`${{ steps.preflight.outputs.live_code_sha256 }}\`"
            echo "- Live RevisionId: \`${{ steps.preflight.outputs.live_revision_id }}\`"
            echo "- Live member state: \`${{ steps.preflight.outputs.live_member_state }}\`"
            echo "- Live member SHA-256: \`${{ steps.preflight.outputs.live_member_sha256 }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply through official receipt-gated overlay writer
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          CHECKSOPS_COMMIT: ${{ github.sha }}
          CHECKSOPS_BRANCH: main
          CHECKSOPS_OPERATOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/lambda-overlay-apply.mjs --apply --input "${{ steps.preflight.outputs.overlay_input }}"

      - name: Public post-deploy smoke
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base='https://psr19uhop4.execute-api.us-east-1.amazonaws.com/staging';
          async function get(path) {
            const res=await fetch(base+path,{headers:{accept:'application/json'}});
            const text=await res.text();
            let body={};
            try { body=JSON.parse(text); } catch {}
            if (res.status !== 200) throw new Error(path+' expected 200, got '+res.status);
            return body;
          }
          const health=await get('/health');
          if (health.status !== 'ok') throw new Error('/health not ok');
          const db=await get('/db-health');
          if (db.status !== 'ok') throw new Error('/db-health not ok');
          for (const key of ['currentDatabase','currentUser','postgresqlVersion','connectedDatabase','secretDatabase']) {
            if (Object.hasOwn(db,key)) throw new Error('/db-health leaked '+key);
          }
          const validation=await get('/db-readonly-validate');
          if (validation.status !== 'ok' || validation.readOnly !== true) throw new Error('/db-readonly-validate not healthy/read-only');
          for (const key of ['tables','privileges','catalog','rlsAudit','currentDatabase','currentUser']) {
            if (Object.hasOwn(validation,key)) throw new Error('/db-readonly-validate leaked '+key);
          }
          console.log(JSON.stringify({health:'ok',dbHealth:'redacted-ok',dbReadonlyValidate:'redacted-ok'}));
          NODE

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        shell: bash
        run: rm -rf .deployment-guard
