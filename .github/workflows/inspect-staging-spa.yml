name: Inspect staging SPA fingerprint

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: inspect-staging-spa
  cancel-in-progress: false

jobs:
  inspect:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1

      - name: Refuse non-main or unexpected staging identity
        shell: bash
        env:
          STAGING_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_SPA_INSPECT_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Inspection is only permitted from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubStagingSpaInspect"
          test "$STAGING_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "Unexpected staging role"; exit 2; }

      - name: Configure read-only staging AWS session through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_SPA_INSPECT_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-spa-inspect-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::checksops-staging-frontend-c48b/index.html"}]}

      - name: Verify assumed staging identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ACCOUNT" = "806168576068" || { echo "Unexpected AWS account"; exit 2; }
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubStagingSpaInspect/checksops-staging-spa-inspect-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Read and report staging SPA fingerprint
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment-guard/staging-spa-inspect.mjs | tee "$RUNNER_TEMP/staging-spa-fingerprint.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = `${process.env.RUNNER_TEMP}/staging-spa-fingerprint.json`;
          const fingerprint = JSON.parse(fs.readFileSync(path, 'utf8'));
          const fields = ['index_html_sha256', 'entry_bundle', 'ETag', 'LastModified'];
          for (const field of fields) {
            if (!Object.hasOwn(fingerprint, field)) throw new Error(`Missing fingerprint field: ${field}`);
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '### Staging SPA fingerprint (read-only)',
            ...fields.map((field) => `- ${field}: \`${fingerprint[field] ?? 'null'}\``),
            '',
          ].join('\n'));
          NODE
