# M6.2N: deploy ONLY moov-recipient-session diagnostic classification
# to production project nbcqwpysqgyxrrbgtmkw. Do not prune or retarget.
name: M6.2N classify session deploy

on:
  push:
    branches:
      - cursor/moov-m62n-classify-account-get-a508
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moov-m62n-classify-session-deploy
  cancel-in-progress: false

jobs:
  deploy-from-repo-secret:
    name: Deploy with repo SUPABASE_ACCESS_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' || env.SUPABASE_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy moov-recipient-session
        id: result
        run: |
          set -euo pipefail
          TOKEN="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SUPABASE_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Repo secrets SUPABASE_ACCESS_TOKEN/SUPABASE_TOKEN are empty."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          chmod +x scripts/m62n-deploy-recipient-session.sh
          scripts/m62n-deploy-recipient-session.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Fingerprint dummy session
        if: steps.result.outputs.deployed == 'true'
        run: python3 scripts/m62n-fingerprint-session.py

  deploy-from-production-secret:
    name: Deploy with Production environment token
    needs: deploy-from-repo-secret
    if: needs.deploy-from-repo-secret.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' || env.SUPABASE_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy moov-recipient-session
        id: result
        run: |
          set -euo pipefail
          unset SUPABASE_PROJECT_ID || true
          TOKEN="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SUPABASE_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Production environment has no SUPABASE_ACCESS_TOKEN/SUPABASE_TOKEN."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          chmod +x scripts/m62n-deploy-recipient-session.sh
          scripts/m62n-deploy-recipient-session.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Fingerprint dummy session
        if: steps.result.outputs.deployed == 'true'
        run: python3 scripts/m62n-fingerprint-session.py

  deploy-from-preview-secret:
    name: Deploy with Preview environment token
    needs: [deploy-from-repo-secret, deploy-from-production-secret]
    if: needs.deploy-from-repo-secret.outputs.deployed != 'true' && needs.deploy-from-production-secret.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_TOKEN: ${{ secrets.SUPABASE_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' || env.SUPABASE_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy moov-recipient-session to production ref only
        id: result
        run: |
          set -euo pipefail
          unset SUPABASE_PROJECT_ID || true
          TOKEN="${SUPABASE_ACCESS_TOKEN:-}"
          if [ -z "$TOKEN" ]; then TOKEN="${SUPABASE_TOKEN:-}"; fi
          if [ -z "$TOKEN" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Preview environment has no SUPABASE_ACCESS_TOKEN/SUPABASE_TOKEN."
            exit 0
          fi
          export SUPABASE_ACCESS_TOKEN="$TOKEN"
          chmod +x scripts/m62n-deploy-recipient-session.sh
          scripts/m62n-deploy-recipient-session.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Fingerprint dummy session
        if: steps.result.outputs.deployed == 'true'
        run: python3 scripts/m62n-fingerprint-session.py

  require-token:
    name: Require a management token
    needs: [deploy-from-repo-secret, deploy-from-production-secret, deploy-from-preview-secret]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if nothing deployed
        run: |
          set -euo pipefail
          repo='${{ needs.deploy-from-repo-secret.outputs.deployed }}'
          prod='${{ needs.deploy-from-production-secret.outputs.deployed }}'
          preview='${{ needs.deploy-from-preview-secret.outputs.deployed }}'
          echo "repo=$repo production=$prod preview=$preview"
          if [ "$repo" = "true" ] || [ "$prod" = "true" ] || [ "$preview" = "true" ]; then
            echo "moov-recipient-session diagnostic deploy succeeded."
            exit 0
          fi
          echo "::error::No Supabase management PAT found in repo, Production, or Preview secrets. Add SUPABASE_ACCESS_TOKEN (sbp_...) with access to nbcqwpysqgyxrrbgtmkw."
          exit 1
