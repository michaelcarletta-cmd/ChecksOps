name: CORS staging live probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/cors-staging-live-probe.yml'
      - 'scripts/deployment-guard/cors-staging-live-probe.mjs'
      - 'scripts/deployment-guard/cors-staging-acceptance.mjs'
      - 'aws/tests/cors-staging-live-probe.test.mjs'

permissions:
  contents: read

concurrency:
  group: cors-staging-live-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
      - name: Unit test probe parser
        run: node --test aws/tests/cors-staging-live-probe.test.mjs aws/tests/cors-staging-acceptance.test.mjs
      - name: Probe live staging CORS (read-only)
        env:
          CHECKSOPS_CORS_ACCEPTANCE_COMMIT: ${{ github.sha }}
          CHECKSOPS_CORS_WORKSTREAM: security-sh2-cors
        run: node scripts/deployment-guard/cors-staging-live-probe.mjs
