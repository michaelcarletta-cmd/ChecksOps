name: Guarded staging Lambda rebuild

# Full-package rebuild of checksops-staging-api from main: aws/functions/api plus a lockfile
# install. inspect only reads and reports the live-vs-candidate difference; apply is refused
# unless every difference is listed in ops/deployment-guard/lambda-rebuild-plan.json, the
# live CodeSha256 still matches the inspect and the exact approval phrase is given. A green
# staging apply is the staging acceptance reference for the production rebuild.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect the live staging package against a fresh build of main, or apply the rebuild"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      approved_commit:
        description: "Required for apply: exact main commit approved for deployment"
        required: false
        default: ""
        type: string
      expected_live_code_sha256:
        description: "Required for apply: live Lambda CodeSha256 from a prior inspect run"
        required: false
        default: ""
        type: string
      approval_phrase:
        description: "Required for apply: exactly DEPLOY FULL API PACKAGE TO STAGING"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: guarded-staging-lambda-overlay
  cancel-in-progress: false

jobs:
  staging-rebuild:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse non-main or incomplete apply
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          INPUT_EXPECTED_LIVE_CODE_SHA256: ${{ inputs.expected_live_code_sha256 }}
          INPUT_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded staging rebuild only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          case "$INPUT_MODE" in
            inspect|apply) ;;
            *) echo "mode must be inspect or apply"; exit 2 ;;
          esac
          if [ "$INPUT_MODE" = "apply" ]; then
            [[ "$INPUT_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "apply requires a 40-character approved_commit"; exit 2; }
            test "$INPUT_APPROVED_COMMIT" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            test -n "$INPUT_EXPECTED_LIVE_CODE_SHA256" || { echo "apply requires expected_live_code_sha256 from inspect"; exit 2; }
            test "$INPUT_APPROVAL_PHRASE" = "DEPLOY FULL API PACKAGE TO STAGING" || { echo "approval_phrase must be exactly: DEPLOY FULL API PACKAGE TO STAGING"; exit 2; }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/lambda-rebuild.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs

      - name: Install the API package from its lockfile
        shell: bash
        run: |
          set -euo pipefail
          test ! -e aws/functions/api/node_modules || { echo "node_modules already exists in a fresh checkout"; exit 2; }
          npm ci --omit=dev --ignore-scripts --no-audit --no-fund --prefix aws/functions/api
          git diff --exit-code -- aws/functions/api/package.json aws/functions/api/package-lock.json
          node -e "require('./aws/functions/api/node_modules/@aws-sdk/client-kms/package.json'); console.log('client-kms present')"

      - name: Validate staging OIDC inputs
        shell: bash
        env:
          STAGING_DEPLOY_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubStagingLambdaOverlay"
          test "$STAGING_DEPLOY_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "CHECKSOPS_STAGING_DEPLOY_ROLE_ARN does not match the dedicated staging deploy role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide an OIDC request URL"; exit 2; }

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-rebuild-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubStagingLambdaOverlay/checksops-staging-rebuild-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Load staging KMS verifier
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:*:key/*) ;;
            *) echo "invalid staging deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
          } >> "$GITHUB_ENV"

      - name: Build the candidate and inspect the live package
        id: preflight
        shell: bash
        env:
          CHECKSOPS_REBUILD_ENVIRONMENT: staging
          CHECKSOPS_REBUILD_MODE: ${{ inputs.mode }}
          CHECKSOPS_EXPECTED_LIVE_CODE_SHA256: ${{ inputs.expected_live_code_sha256 }}
          CHECKSOPS_REBUILD_APPROVAL: ${{ inputs.approval_phrase }}
        run: node scripts/deployment-guard/github-lambda-rebuild.mjs

      - name: Record inspected live state
        if: ${{ always() }}
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          STATE: ${{ steps.preflight.outputs.state }}
          LIVE_CODE_SHA256: ${{ steps.preflight.outputs.live_code_sha256 }}
          LIVE_REVISION_ID: ${{ steps.preflight.outputs.live_revision_id }}
          LIVE_MEMBER_COUNT: ${{ steps.preflight.outputs.live_member_count }}
          CANDIDATE_ZIP_SHA256: ${{ steps.preflight.outputs.candidate_zip_sha256 }}
          CANDIDATE_MEMBER_COUNT: ${{ steps.preflight.outputs.candidate_member_count }}
          CHANGED_COUNT: ${{ steps.preflight.outputs.changed_count }}
          ADDED_COUNT: ${{ steps.preflight.outputs.added_count }}
          REMOVED_COUNT: ${{ steps.preflight.outputs.removed_count }}
          PROBLEM_COUNT: ${{ steps.preflight.outputs.problem_count }}
          DIFF_FILE: ${{ steps.preflight.outputs.diff_file }}
        run: |
          {
            echo "### Staging Lambda rebuild preflight"
            echo "- Mode: \`$INPUT_MODE\` / state: \`$STATE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Live CodeSha256: \`$LIVE_CODE_SHA256\` / RevisionId: \`$LIVE_REVISION_ID\` / members: \`$LIVE_MEMBER_COUNT\`"
            echo "- Candidate ZIP SHA-256: \`$CANDIDATE_ZIP_SHA256\` / members: \`$CANDIDATE_MEMBER_COUNT\`"
            echo "- Source members changed/added/removed: \`$CHANGED_COUNT\` / \`$ADDED_COUNT\` / \`$REMOVED_COUNT\`; unlisted problems: \`$PROBLEM_COUNT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIFF_FILE" ] && [ -f "$DIFF_FILE" ]; then
            cp "$DIFF_FILE" "$RUNNER_TEMP/rebuild-diff-staging.json"
          fi

      - name: Upload the live-vs-candidate diff (hashes only)
        if: ${{ always() && steps.preflight.outputs.diff_file != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rebuild-diff-staging-${{ github.run_id }}
          path: ${{ runner.temp }}/rebuild-diff-staging.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply through the official receipt-gated rebuild writer
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          CHECKSOPS_COMMIT: ${{ github.sha }}
          CHECKSOPS_BRANCH: main
          CHECKSOPS_OPERATOR: ${{ github.actor }}
          REBUILD_INPUT: ${{ steps.preflight.outputs.rebuild_input }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/lambda-rebuild-apply.mjs --apply --input "$REBUILD_INPUT"

      - name: Verify the live package is the candidate
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_REBUILD_ENVIRONMENT: staging
          CHECKSOPS_REBUILD_MODE: verify
        run: node scripts/deployment-guard/github-lambda-rebuild.mjs

      - name: Public staging smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'https://psr19uhop4.execute-api.us-east-1.amazonaws.com/staging';
          async function get(path, allowedKeys) {
            const res = await fetch(base + path, { method: 'GET', headers: { accept: 'application/json' }, signal: AbortSignal.timeout(20000) });
            let body = {};
            try { body = JSON.parse(await res.text()); } catch {}
            const jsonObject = body !== null && typeof body === 'object' && !Array.isArray(body);
            const redacted = jsonObject && (!allowedKeys || Object.keys(body).every((key) => allowedKeys.includes(key)));
            console.log(JSON.stringify({ path, httpStatus: res.status, status: jsonObject && ['ok', 'unhealthy'].includes(body.status) ? body.status : 'unexpected', redacted }));
            if (res.status !== 200) throw new Error(path + ' expected 200, got ' + res.status);
            if (!redacted) throw new Error(path + ' unexpected response shape (body withheld)');
            return body;
          }
          const health = await get('/health');
          if (health.status !== 'ok') throw new Error('/health not ok');
          const db = await get('/db-health', ['service', 'status']);
          if (db.status !== 'ok') throw new Error('/db-health not ok');
          const validation = await get('/db-readonly-validate', ['service', 'status', 'readOnly']);
          if (validation.status !== 'ok' || validation.readOnly !== true) throw new Error('/db-readonly-validate not healthy/read-only');
          NODE

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        shell: bash
        run: rm -rf .deployment-guard aws/functions/api/node_modules
