name: Guarded production CSP headers

# SPA CSP rollout step 5 (ops/security/SPA_CSP_ROLLOUT.md, runbook
# ops/deployment-guard/PRODUCTION_CSP_HEADERS.md): the enforcing Content-Security-Policy on
# https://checksops.com, set in place on the existing production response headers policy
# 756a8f23-68dd-4f8a-8293-5a2fd08f919a (default behavior, /prep, /prep/*) of distribution
# E1B0ZWWO5559U5. The distribution is never changed and no policy is created.
# inspect reads the distribution, the policy and the live production index.html. enforce adds the
# CSP built from that index.html to the SH-1 baseline headers; revert puts exactly the SH-1 baseline
# back. Each change is refused unless the live snapshot still matches the inspect, the exact phrase
# and a staging acceptance reference are given, and the production environment reviewer approves.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect the live production state, enforce the CSP, or revert to the SH-1 baseline (no CSP)"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - enforce
          - revert
      approved_commit:
        description: "Required for a change: exact main commit approved for this run"
        required: false
        default: ""
        type: string
      expected_snapshot_sha256:
        description: "Required for a change: snapshot SHA-256 from a prior inspect run"
        required: false
        default: ""
        type: string
      staging_acceptance_reference:
        description: "Required for a change: ChecksOps GitHub run or PR URL (enforce: the staging enforce run)"
        required: false
        default: ""
        type: string
      approval_phrase:
        description: "enforce: ENFORCE CSP ON PRODUCTION / revert: REMOVE CSP FROM PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

# Shares the production SPA upload's group: both change what checksops.com serves, and the CSP's
# inline-script hash comes from the index.html that upload writes.
concurrency:
  group: guarded-production-spa-upload
  cancel-in-progress: false

jobs:
  production-csp:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse non-main or incomplete change
        shell: bash
        # Inputs reach the script only through env, never as interpolated shell source.
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          INPUT_EXPECTED_SNAPSHOT_SHA256: ${{ inputs.expected_snapshot_sha256 }}
          INPUT_STAGING_ACCEPTANCE: ${{ inputs.staging_acceptance_reference }}
          INPUT_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded production CSP change only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          case "$INPUT_MODE" in
            inspect) ;;
            enforce) PHRASE="ENFORCE CSP ON PRODUCTION" ;;
            revert) PHRASE="REMOVE CSP FROM PRODUCTION" ;;
            *) echo "mode must be inspect, enforce or revert"; exit 2 ;;
          esac
          if [ "$INPUT_MODE" != "inspect" ]; then
            [[ "$INPUT_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "$INPUT_MODE requires a 40-character approved_commit"; exit 2; }
            test "$INPUT_APPROVED_COMMIT" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            [[ "$INPUT_EXPECTED_SNAPSHOT_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "$INPUT_MODE requires expected_snapshot_sha256 from inspect"; exit 2; }
            [[ "$INPUT_STAGING_ACCEPTANCE" =~ ^https://github\.com/michaelcarletta-cmd/ChecksOps/(actions/runs/[0-9]+(/job/[0-9]+)?|pull/[0-9]+)$ ]] || { echo "$INPUT_MODE requires staging_acceptance_reference (a ChecksOps run or PR URL)"; exit 2; }
            test "$INPUT_APPROVAL_PHRASE" = "$PHRASE" || { echo "approval_phrase must be exactly: $PHRASE"; exit 2; }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/github-production-csp-headers.test.mjs
          node --test aws/tests/spa-csp.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs

      - name: Validate production OIDC inputs
        shell: bash
        env:
          PRODUCTION_CSP_ROLE_ARN: ${{ vars.CHECKSOPS_PRODUCTION_CSP_HEADERS_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$PRODUCTION_CSP_ROLE_ARN" = "arn:aws:iam::806168576068:role/ChecksOpsGitHubProductionCspHeaders" || { echo "CHECKSOPS_PRODUCTION_CSP_HEADERS_ROLE_ARN must be the dedicated production CSP headers role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide an OIDC request URL"; exit 2; }

      - name: Configure read-only production AWS session (inspect)
        if: ${{ inputs.mode == 'inspect' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_PRODUCTION_CSP_HEADERS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-production-csp-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudfront:GetDistribution"],"Resource":"arn:aws:cloudfront::806168576068:distribution/E1B0ZWWO5559U5"},{"Effect":"Allow","Action":["cloudfront:GetResponseHeadersPolicy"],"Resource":"arn:aws:cloudfront::806168576068:response-headers-policy/756a8f23-68dd-4f8a-8293-5a2fd08f919a"},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::checksops-production-frontend-806168576068/index.html"}]}

      - name: Configure production CSP headers session (enforce / revert)
        if: ${{ inputs.mode != 'inspect' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_PRODUCTION_CSP_HEADERS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-production-csp-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["cloudfront:GetDistribution"],"Resource":"arn:aws:cloudfront::806168576068:distribution/E1B0ZWWO5559U5"},{"Effect":"Allow","Action":["cloudfront:GetResponseHeadersPolicy","cloudfront:UpdateResponseHeadersPolicy"],"Resource":"arn:aws:cloudfront::806168576068:response-headers-policy/756a8f23-68dd-4f8a-8293-5a2fd08f919a"},{"Effect":"Allow","Action":["s3:GetObject"],"Resource":"arn:aws:s3:::checksops-production-frontend-806168576068/index.html"},{"Effect":"Allow","Action":["kms:Sign","kms:GetPublicKey"],"Resource":"arn:aws:kms:us-east-1:806168576068:key/*"}]}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubProductionCspHeaders/checksops-production-csp-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Load production KMS verifier
        if: ${{ inputs.mode != 'inspect' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_PRODUCTION_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:806168576068:key/*) ;;
            *) echo "invalid production deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
          } >> "$GITHUB_ENV"

      - name: Inspect the live production distribution
        id: preflight
        shell: bash
        env:
          CHECKSOPS_PRODUCTION_CSP_MODE: ${{ inputs.mode }}
          CHECKSOPS_EXPECTED_SNAPSHOT_SHA256: ${{ inputs.expected_snapshot_sha256 }}
          CHECKSOPS_STAGING_ACCEPTANCE_REFERENCE: ${{ inputs.staging_acceptance_reference }}
          CHECKSOPS_PRODUCTION_CSP_APPROVAL: ${{ inputs.approval_phrase }}
        run: node scripts/deployment-guard/github-production-csp-headers.mjs

      - name: Record inspected live state
        if: ${{ always() }}
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          STATE: ${{ steps.preflight.outputs.state }}
          SNAPSHOT_SHA256: ${{ steps.preflight.outputs.snapshot_sha256 }}
          DISTRIBUTION_ETAG: ${{ steps.preflight.outputs.distribution_etag }}
          POLICY_ETAG: ${{ steps.preflight.outputs.policy_etag }}
          INDEX_SHA256: ${{ steps.preflight.outputs.index_html_sha256 }}
          CSP_ENFORCING: ${{ steps.preflight.outputs.csp_enforcing }}
          PROBLEMS: ${{ steps.preflight.outputs.problems }}
        run: |
          {
            echo "### Production CSP headers preflight"
            echo "- Mode: \`$INPUT_MODE\` / state: \`$STATE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Snapshot SHA-256: \`$SNAPSHOT_SHA256\`"
            echo "- Distribution ETag: \`$DISTRIBUTION_ETAG\` / policy 756a8f23-68dd-4f8a-8293-5a2fd08f919a ETag: \`$POLICY_ETAG\`"
            echo "- Live index.html SHA-256: \`$INDEX_SHA256\`"
            echo "- Content-Security-Policy (enforce): \`$CSP_ENFORCING\`"
            echo "- Drift: \`${PROBLEMS:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Change through the official receipt-gated production CSP writer
        if: ${{ inputs.mode != 'inspect' }}
        shell: bash
        env:
          CHECKSOPS_PRODUCTION_CSP_EXECUTE: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          CHECKSOPS_COMMIT: ${{ github.sha }}
          CHECKSOPS_BRANCH: main
          CHECKSOPS_OPERATOR: ${{ github.actor }}
          CHECKSOPS_PRODUCTION_CSP_INPUT: ${{ steps.preflight.outputs.csp_input }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/production-csp-headers.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify the production state and that nothing else moved
        if: ${{ inputs.mode != 'inspect' }}
        shell: bash
        env:
          CHECKSOPS_PRODUCTION_CSP_MODE: verify
          CHECKSOPS_PRODUCTION_CSP_VERIFY_EXPECT: ${{ inputs.mode == 'enforce' && 'enforcing' || 'baseline' }}
        run: node scripts/deployment-guard/github-production-csp-headers.mjs

      - name: Public production header check
        if: ${{ inputs.mode != 'inspect' }}
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          EXPECTED_ENFORCING: ${{ steps.preflight.outputs.csp_enforcing }}
        run: |
          set -euo pipefail
          # enforce: exactly the enforcing CSP; revert: no CSP. Both: the SH-1 headers, no report-only.
          # CloudFront propagates a policy change to edges over a few minutes.
          case "$INPUT_MODE" in
            enforce) WANT_ENFORCING=1 ;;
            revert) WANT_ENFORCING=0 ;;
            *) echo "unexpected mode"; exit 2 ;;
          esac
          test "$WANT_ENFORCING" = 0 || test -n "$EXPECTED_ENFORCING" || { echo "expected enforcing CSP missing"; exit 2; }
          for attempt in $(seq 1 20); do
            rm -f headers.txt
            curl -fsS --max-time 20 -o /dev/null -D headers.txt -H 'Cache-Control: no-cache' "https://checksops.com/?csp=$GITHUB_RUN_ID-$attempt" || true
            report_only=0; enforcing=0; enforcing_value=""; baseline=1
            grep -qi '^content-security-policy-report-only:' headers.txt 2>/dev/null && report_only=1
            if grep -qi '^content-security-policy:' headers.txt 2>/dev/null; then
              enforcing=1
              enforcing_value="$(grep -i '^content-security-policy:' headers.txt | head -n 1 | cut -d: -f2- | tr -d '\r' | sed 's/^ *//')"
            fi
            grep -qi '^strict-transport-security: max-age=31536000; includesubdomains' headers.txt 2>/dev/null || baseline=0
            grep -qi '^x-frame-options: sameorigin' headers.txt 2>/dev/null || baseline=0
            grep -qi '^x-content-type-options: nosniff' headers.txt 2>/dev/null || baseline=0
            grep -qi '^referrer-policy: strict-origin-when-cross-origin' headers.txt 2>/dev/null || baseline=0
            # An edge may still serve the previous value; only the expected one counts.
            if [ "$report_only" = 0 ] && [ "$baseline" = 1 ] && [ "$enforcing" = "$WANT_ENFORCING" ] && { [ "$WANT_ENFORCING" = 0 ] || [ "$enforcing_value" = "$EXPECTED_ENFORCING" ]; }; then
              echo "- Public production (attempt $attempt): enforcing present=$enforcing, SH-1 headers present" >> "$GITHUB_STEP_SUMMARY"
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "public production did not reach the expected header state for $INPUT_MODE (report-only=$report_only, enforcing=$enforcing, baseline=$baseline: $enforcing_value)"
              exit 2
            fi
            sleep 30
          done
          # The API behind the same policy keeps working.
          STATUS="$(curl -sS --max-time 20 -o health.json -w '%{http_code}' https://checksops.com/prep/health || true)"
          test "$STATUS" = 200 || { echo "/prep/health returned $STATUS"; exit 2; }
          node -e 'const b = JSON.parse(require("fs").readFileSync("health.json", "utf8")); if (b?.status !== "ok") process.exit(2);' || { echo "/prep/health is not ok"; exit 2; }
          echo "- /prep/health: 200 ok" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        run: rm -rf .deployment-guard headers.txt health.json
