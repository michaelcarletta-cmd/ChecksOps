name: AWS Migration CI

on:
  pull_request:
    paths:
      - 'aws/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.env.aws.example'
      - '.env.production.aws.example'
      - '.github/workflows/aws-migration-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'aws/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'bun.lock'
      - '.env.aws.example'
      - '.env.production.aws.example'
      - '.github/workflows/aws-migration-ci.yml'

permissions:
  contents: read

concurrency:
  group: aws-migration-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aws-migration-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch default branch for protected-SQL diffs
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Install AWS API runtime dependencies
        run: npm ci --prefix aws/functions/api

      - name: Verify publishable-key boundary
        run: bun run check:publish-keys

      # pdftoppm (poppler) renders PDFs for the signature placement tests. Ubuntu's apt mirrors are the
      # usual source; when they cannot be reached (as on 2026-11-11, when DNS for the Ubuntu archive failed
      # on the hosted runners), install the same tool from conda-forge instead. The tests always run
      # against a real pdftoppm: the last step fails the job if neither source provided it.
      - name: Install PDF rasterizer for signature placement tests (Ubuntu apt)
        id: poppler_apt
        continue-on-error: true
        timeout-minutes: 6
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get -o Acquire::Retries=2 install -y --no-install-recommends poppler-utils

      - name: Install PDF rasterizer for signature placement tests (conda-forge fallback)
        if: steps.poppler_apt.outcome != 'success'
        timeout-minutes: 8
        run: |
          set -euo pipefail
          echo "::warning::Ubuntu apt mirror unavailable; installing poppler from conda-forge"
          mkdir -p "$RUNNER_TEMP/micromamba"
          curl -fsSL --retry 3 https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C "$RUNNER_TEMP/micromamba" bin/micromamba
          "$RUNNER_TEMP/micromamba/bin/micromamba" create -y -p "$RUNNER_TEMP/poppler" -c conda-forge --override-channels poppler
          echo "$RUNNER_TEMP/poppler/bin" >> "$GITHUB_PATH"

      - name: Verify PDF rasterizer
        run: |
          command -v pdftoppm
          pdftoppm -v || true

      - name: Run AWS API/provider regression suite
        run: bun run test:aws-api

      - name: Prepare staging-only AWS frontend environment
        run: cp .env.aws.example .env.aws

      - name: Build AWS staging frontend
        run: bun run build:aws

      - name: Assert production activation remains disabled in template
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq 'AWS_PROVIDER_EXECUTION_ENABLED[^\n]*false|AWS_PROVIDER_EXECUTION_ENABLED[[:space:]]*:[[:space:]]*"?false"?' aws/template.yaml
          grep -Eq 'AWS_FINANCIAL_PERMISSIONS_ACTIVATED[^\n]*false|AWS_FINANCIAL_PERMISSIONS_ACTIVATED[[:space:]]*:[[:space:]]*"?false"?' aws/template.yaml
          grep -Eq 'AWS_MOOV_ENABLED[^\n]*false|AWS_MOOV_ENABLED[[:space:]]*:[[:space:]]*"?false"?' aws/template.yaml
          grep -Eq 'AWS_CHECKALT_ENABLED[^\n]*false|AWS_CHECKALT_ENABLED[[:space:]]*:[[:space:]]*"?false"?' aws/template.yaml
          grep -Fq 'COGNITO_WEBAUTHN_ORIGIN: "https://staging.checksops.com"' aws/template.yaml
          grep -Fq 'COGNITO_WEBAUTHN_RP_ID: "staging.checksops.com"' aws/template.yaml

      - name: Assert production financial activation SQL is never auto-applied
        shell: bash
        run: |
          set -euo pipefail
          for sqlfile in 64_financial_activation_grants.sql 65_checkalt_production_writer.sql; do
            matches="$(grep -R --line-number \
              --include='*.sh' --include='*.bash' --include='*.mjs' --include='*.js' --include='*.ts' --include='*.tsx' --include='*.yml' --include='*.yaml' \
              --exclude='aws-migration-ci.yml' \
              -E "(psql|execute|apply|run)[^[:cntrl:]]*${sqlfile}" \
              .github aws scripts 2>/dev/null || true)"
            if [ -n "$matches" ]; then
              printf '%s\n' "$matches"
              echo "Found executable automation that may apply ${sqlfile}"
              exit 1
            fi
          done
          grep -Fq "SELECT 'NOT_APPLIED'" aws/financial/sql/64_financial_activation_grants.sql
          grep -Fq "SELECT 'NOT_APPLIED'" aws/financial/sql/65_checkalt_production_writer.sql
