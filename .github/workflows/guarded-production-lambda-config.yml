name: Guarded production Lambda configuration

# Environment-variable change for checksops-production-prep-api. inspect only reads the live
# configuration and reports the state of every key ops/deployment-guard/lambda-config-plan.json
# lists; apply is refused unless every listed key still holds its recorded live value, the live
# RevisionId still matches the inspect and the exact approval phrase is given. Nothing outside
# Environment.Variables is ever sent. The production environment reviewer must approve the job.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect the live production configuration against the plan, or apply the planned change"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - apply
      approved_commit:
        description: "Required for apply: exact main commit approved for deployment"
        required: false
        default: ""
        type: string
      expected_live_revision_id:
        description: "Required for apply: live Lambda RevisionId from a prior inspect run"
        required: false
        default: ""
        type: string
      staging_acceptance_reference:
        description: "Required for apply: ChecksOps GitHub run or PR URL recording the staging configuration acceptance"
        required: false
        default: ""
        type: string
      approval_phrase:
        description: "Required for apply: exactly APPLY API CONFIGURATION TO PRODUCTION"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: guarded-production-lambda-overlay
  cancel-in-progress: false

jobs:
  production-config:
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Refuse non-main or incomplete apply
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          INPUT_EXPECTED_LIVE_REVISION_ID: ${{ inputs.expected_live_revision_id }}
          INPUT_STAGING_ACCEPTANCE: ${{ inputs.staging_acceptance_reference }}
          INPUT_APPROVAL_PHRASE: ${{ inputs.approval_phrase }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded production configuration change only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          case "$INPUT_MODE" in
            inspect|apply) ;;
            *) echo "mode must be inspect or apply"; exit 2 ;;
          esac
          if [ "$INPUT_MODE" = "apply" ]; then
            [[ "$INPUT_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "apply requires a 40-character approved_commit"; exit 2; }
            test "$INPUT_APPROVED_COMMIT" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            test -n "$INPUT_EXPECTED_LIVE_REVISION_ID" || { echo "apply requires expected_live_revision_id from inspect"; exit 2; }
            test "$INPUT_APPROVAL_PHRASE" = "APPLY API CONFIGURATION TO PRODUCTION" || { echo "approval_phrase must be exactly: APPLY API CONFIGURATION TO PRODUCTION"; exit 2; }
            test -n "$INPUT_STAGING_ACCEPTANCE" || { echo "apply requires staging_acceptance_reference"; exit 2; }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/lambda-config.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs


      - name: Validate production OIDC inputs
        shell: bash
        env:
          PRODUCTION_DEPLOY_ROLE_ARN: ${{ vars.CHECKSOPS_PRODUCTION_DEPLOY_ROLE_ARN }}
        run: |
          set -euo pipefail
          EXPECTED_ROLE_ARN="arn:aws:iam::806168576068:role/ChecksOpsGitHubProductionLambdaOverlay"
          test "$PRODUCTION_DEPLOY_ROLE_ARN" = "$EXPECTED_ROLE_ARN" || { echo "CHECKSOPS_PRODUCTION_DEPLOY_ROLE_ARN must be the dedicated production overlay role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide an OIDC request URL"; exit 2; }

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_PRODUCTION_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-production-config-${{ github.run_id }}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubProductionLambdaOverlay/checksops-production-config-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Load production KMS verifier
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_PRODUCTION_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:806168576068:key/*) ;;
            *) echo "invalid production deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
          } >> "$GITHUB_ENV"

      - name: Inspect the live configuration against the plan
        id: preflight
        shell: bash
        env:
          CHECKSOPS_CONFIG_ENVIRONMENT: production
          CHECKSOPS_CONFIG_MODE: ${{ inputs.mode }}
          CHECKSOPS_EXPECTED_LIVE_REVISION_ID: ${{ inputs.expected_live_revision_id }}
          CHECKSOPS_STAGING_ACCEPTANCE_REFERENCE: ${{ inputs.staging_acceptance_reference }}
          CHECKSOPS_CONFIG_APPROVAL: ${{ inputs.approval_phrase }}
        run: node scripts/deployment-guard/github-lambda-config.mjs

      - name: Record inspected live state
        if: ${{ always() }}
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          STATE: ${{ steps.preflight.outputs.state }}
          LIVE_CODE_SHA256: ${{ steps.preflight.outputs.live_code_sha256 }}
          LIVE_REVISION_ID: ${{ steps.preflight.outputs.live_revision_id }}
          LIVE_CONFIGURATION_SHA256: ${{ steps.preflight.outputs.live_configuration_sha256 }}
          LIVE_VARIABLE_COUNT: ${{ steps.preflight.outputs.live_variable_count }}
          CHANGE_SHA256: ${{ steps.preflight.outputs.change_sha256 }}
          CHANGE_COUNT: ${{ steps.preflight.outputs.change_count }}
          PROBLEM_COUNT: ${{ steps.preflight.outputs.problem_count }}
          DIFF_FILE: ${{ steps.preflight.outputs.diff_file }}
        run: |
          {
            echo "### Production Lambda configuration preflight"
            echo "- Mode: \`$INPUT_MODE\` / state: \`$STATE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Live CodeSha256: \`$LIVE_CODE_SHA256\` / RevisionId: \`$LIVE_REVISION_ID\` / configuration SHA-256: \`$LIVE_CONFIGURATION_SHA256\` / variables: \`$LIVE_VARIABLE_COUNT\`"
            echo "- Plan change SHA-256: \`$CHANGE_SHA256\` / listed keys: \`$CHANGE_COUNT\`; keys not at their recorded live value: \`$PROBLEM_COUNT\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$DIFF_FILE" ] && [ -f "$DIFF_FILE" ]; then
            cp "$DIFF_FILE" "$RUNNER_TEMP/config-diff-production.json"
          fi

      - name: Upload the plan-vs-live key report (listed keys only)
        if: ${{ always() && steps.preflight.outputs.diff_file != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: config-diff-production-${{ github.run_id }}
          path: ${{ runner.temp }}/config-diff-production.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Apply through the official receipt-gated configuration writer
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          CHECKSOPS_COMMIT: ${{ github.sha }}
          CHECKSOPS_BRANCH: main
          CHECKSOPS_OPERATOR: ${{ github.actor }}
          CONFIG_INPUT: ${{ steps.preflight.outputs.config_input }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/lambda-config-apply.mjs --apply --input "$CONFIG_INPUT"

      - name: Verify the live environment holds the planned values
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_CONFIG_ENVIRONMENT: production
          CHECKSOPS_CONFIG_MODE: verify
        run: node scripts/deployment-guard/github-lambda-config.mjs

      - name: Public production smoke
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const base = 'https://checksops.com/prep';
          // /db-health answers 503 unless its probe passes. The redacted build reports only status;
          // older builds report the probe fields (select1, authentication).
          const word = (value) => (typeof value === 'string' && /^[a-z_]{1,24}$/.test(value) ? value : null);
          const checks = {
            '/health': (body) => body?.status === 'ok',
            '/db-health': (body) => body?.status === 'ok' || (body?.select1 === 'ok' && body?.authentication === 'ok'),
          };
          for (const [path, healthy] of Object.entries(checks)) {
            const res = await fetch(base + path, { method: 'GET', headers: { accept: 'application/json' }, signal: AbortSignal.timeout(20000) });
            let body = {};
            try { body = JSON.parse(await res.text()); } catch {}
            const ok = res.status === 200 && healthy(body);
            console.log(JSON.stringify({ path, httpStatus: res.status, healthy: ok, status: word(body?.status), select1: word(body?.select1), authentication: word(body?.authentication) }));
            if (!ok) throw new Error(path + ' is not healthy');
          }
          NODE

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        shell: bash
        run: rm -rf .deployment-guard
