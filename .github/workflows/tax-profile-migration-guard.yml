name: Tax profile migration guard

on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/security/**'
      - 'scripts/check-recipient-tax-profile-migrations.mjs'
      - 'scripts/run-hosted-tax-profile-containment.mjs'
      - 'scripts/recipient-tax-profile-migration-allowlist.txt'
      - '.github/workflows/tax-profile-migration-guard.yml'
      - 'package.json'
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'
      - 'supabase/security/**'
      - 'scripts/check-recipient-tax-profile-migrations.mjs'
      - 'scripts/run-hosted-tax-profile-containment.mjs'
      - 'scripts/recipient-tax-profile-migration-allowlist.txt'
      - '.github/workflows/tax-profile-migration-guard.yml'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: tax-profile-migration-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    # Pinned (2026-11-13): ubuntu-latest moved to ubuntu-26.04, which has no PostgreSQL 16
    # (/usr/lib/postgresql/16/bin). hosted-containment-wrapper.test.mjs asserts on the pinned psql there, so the job fails on 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fail closed on unauthorized tax-profile privilege migrations
        run: node scripts/check-recipient-tax-profile-migrations.mjs

      - name: Run migration-guard unit tests
        run: node --test supabase/security/migration-guard.test.mjs

      - name: Run operator-wrapper unit tests (no remote connections)
        run: node --test supabase/security/hosted-containment-wrapper.test.mjs
