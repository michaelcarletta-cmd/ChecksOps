name: SQL53 upload verified source to temporary runner bucket

# Three jobs, so no npm-installed or test code ever runs in a job that can mint an
# AWS token, and the tarball cannot change after it is hashed:
#   package   (contents: read)  build, write SOURCE_COMMIT, tar, sha256 (job output)
#   contracts (contents: read)  run the runner contracts on a copy extracted from the
#                               handed-off tarball, after re-verifying its sha256
#   upload    (id-token: write) runs no repository or npm code; re-verifies the
#                               tarball against the package job's sha256 output, then
#                               uploads it

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.hash.outputs.tarball }}
      sha256: ${{ steps.hash.outputs.sha256 }}
    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Verify SQL53 source and production pin
        shell: bash
        run: |
          set -euo pipefail
          echo "5a8f8bc35c69f2b339c78f3637d6bb1c606117967e3ab9d83b5dec1d37561197  aws/workflows/sql/53_claim_settlement_breakdown.sql" | sha256sum -c -
          node -e '
            const p = require("./ops/deployment-guard/sql53-production-apply.json");
            if (p.source_sha256 !== "5a8f8bc35c69f2b339c78f3637d6bb1c606117967e3ab9d83b5dec1d37561197") process.exit(1);
            if (p.target_environment !== "production" || p.target_component !== "production-sql") process.exit(1);
            console.log(`pin execute=${p.execute} apply_authorized=${p.apply_authorized}`);
          '
      - name: Package source with runner-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          PG=$(node -p 'require("./package-lock.json").packages["node_modules/pg"].version')
          SM=$(node -p 'require("./package-lock.json").packages["node_modules/@aws-sdk/client-secrets-manager"].version')
          mkdir -p /tmp/pkg/src /tmp/pkg/deps
          git archive HEAD | tar -x -C /tmp/pkg/src
          cd /tmp/pkg/deps
          echo '{"name":"sql53-runner-deps","private":true}' > package.json
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "pg@${PG}" "@aws-sdk/client-secrets-manager@${SM}"
          mv node_modules /tmp/pkg/src/node_modules
          # The runner contract aws/tests/api-write.test.mjs imports aws/functions/api, whose
          # runtime dependencies (@aws-sdk/client-s3 and the rest) come from that package's own
          # reviewed lockfile, exactly as aws-migration-ci.yml installs them.
          npm ci --prefix /tmp/pkg/src/aws/functions/api --ignore-scripts --omit=dev --no-audit --no-fund
          # Provenance: the one-shot refuses a tree whose SOURCE_COMMIT is not its --commit.
          printf '%s\n' "${SHA}" > /tmp/pkg/src/SOURCE_COMMIT
      - name: Compress and hash
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          mkdir -p /tmp/pkg/out
          tar -czf "/tmp/pkg/out/source-${SHA}.tar.gz" -C /tmp/pkg/src .
          cd /tmp/pkg/out
          sha256sum "source-${SHA}.tar.gz" | tee "source-${SHA}.tar.gz.sha256"
          SUM=$(cut -d' ' -f1 "source-${SHA}.tar.gz.sha256")
          echo "tarball=source-${SHA}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=${SUM}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_COMMIT ${SHA}"
          echo "TARBALL_SHA256 ${SUM}  (pass as --expected-tarball-sha256 to production-sql-one-shot.mjs)"
      - name: Hand off the hashed tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sql53-source
          path: /tmp/pkg/out/
          if-no-files-found: error
          retention-days: 1

  contracts:
    runs-on: ubuntu-latest
    needs: package
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
      - name: Download the hashed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sql53-source
          path: /tmp/handoff
      - name: Re-verify and extract into a fresh directory
        shell: bash
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd /tmp/handoff
          echo "${EXPECTED}  ${TARBALL}" | sha256sum -c -
          mkdir /tmp/runner-copy
          tar -xzf "${TARBALL}" -C /tmp/runner-copy
          test "$(cat /tmp/runner-copy/SOURCE_COMMIT)" = "${GITHUB_SHA}"
      - name: Run the runner contracts on the extracted copy
        shell: bash
        run: |
          set -euo pipefail
          # /tmp/runner-copy has no parent node_modules, so modules resolve the way they do on
          # the runner. The list is what accepted-contracts.json requires for a production
          # sql-apply, the same set preflight and the one-shot enforce.
          cd /tmp/runner-copy
          # Command substitution (not process substitution) so a failing node exits the step.
          LIST=$(node --input-type=module -e '
            import { loadContractRegistry, relevantContracts } from "./scripts/deployment-guard/lib/contracts.mjs";
            const rows = relevantContracts(loadContractRegistry(process.cwd()), { environment: "production", component: "production-sql", deployment_type: "sql-apply" })
              .filter((row) => row.accepted === true);
            if (!rows.length) process.exit(1);
            for (const row of rows) console.log(row.test);
          ')
          mapfile -t TESTS <<<"$LIST"
          test "${#TESTS[@]}" -gt 0
          test -n "${TESTS[0]}"
          printf 'contract test: %s\n' "${TESTS[@]}"
          node --test "${TESTS[@]}"

  upload:
    runs-on: ubuntu-latest
    needs: [package, contracts]
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the hashed tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: sql53-source
          path: /tmp/handoff
      - name: Re-verify against the package job's sha256
        shell: bash
        env:
          TARBALL: ${{ needs.package.outputs.tarball }}
          EXPECTED: ${{ needs.package.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd /tmp/handoff
          test "${TARBALL}" = "source-${GITHUB_SHA}.tar.gz"
          echo "${EXPECTED}  ${TARBALL}" | sha256sum -c -
          test "$(cut -d' ' -f1 "${TARBALL}.sha256")" = "${EXPECTED}"
          echo "TARBALL_SHA256 ${EXPECTED}"
      - name: Assume temporary artifact-upload-only role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: arn:aws:iam::806168576068:role/ChecksOpsGitHubSql53ArtifactUpload
          aws-region: us-east-1
          role-session-name: sql53-reviewed-package-upload
      - name: Upload reviewed source only
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          for f in "source-${SHA}.tar.gz" "source-${SHA}.tar.gz.sha256"; do
            aws s3 cp "/tmp/handoff/${f}" "s3://checksops-sql53-transfer-806168576068/sql53/${f}" --sse AES256 --no-progress
          done
          aws s3api head-object --bucket checksops-sql53-transfer-806168576068 --key "sql53/source-${SHA}.tar.gz" --query '{ContentLength:ContentLength,ServerSideEncryption:ServerSideEncryption}' --output json
