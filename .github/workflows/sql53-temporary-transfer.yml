name: SQL53 upload verified source to temporary runner bucket

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  upload:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout reviewed main source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify SQL53 source and production pin
        shell: bash
        run: |
          set -euo pipefail
          echo "5a8f8bc35c69f2b339c78f3637d6bb1c606117967e3ab9d83b5dec1d37561197  aws/workflows/sql/53_claim_settlement_breakdown.sql" | sha256sum -c -
          node -e '
            const p = require("./ops/deployment-guard/sql53-production-apply.json");
            if (p.source_sha256 !== "5a8f8bc35c69f2b339c78f3637d6bb1c606117967e3ab9d83b5dec1d37561197") process.exit(1);
            if (p.target_environment !== "production" || p.target_component !== "production-sql") process.exit(1);
            console.log(`pin execute=${p.execute} apply_authorized=${p.apply_authorized}`);
          '
      - name: Package source with runner-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          PG=$(node -p 'require("./package-lock.json").packages["node_modules/pg"].version')
          SM=$(node -p 'require("./package-lock.json").packages["node_modules/@aws-sdk/client-secrets-manager"].version')
          mkdir -p /tmp/pkg/src /tmp/pkg/deps
          git archive HEAD | tar -x -C /tmp/pkg/src
          cd /tmp/pkg/deps
          echo '{"name":"sql53-runner-deps","private":true}' > package.json
          npm install --ignore-scripts --omit=optional --no-audit --no-fund "pg@${PG}" "@aws-sdk/client-secrets-manager@${SM}"
          mv node_modules /tmp/pkg/src/node_modules
          # The runner contract aws/tests/api-write.test.mjs imports aws/functions/api, whose
          # runtime dependencies (@aws-sdk/client-s3 and the rest) come from that package's own
          # reviewed lockfile, exactly as aws-migration-ci.yml installs them.
          npm ci --prefix /tmp/pkg/src/aws/functions/api --ignore-scripts --omit=dev --no-audit --no-fund
      - name: Run the runner contracts against the packaged tree
        shell: bash
        run: |
          set -euo pipefail
          # /tmp/pkg/src has no parent node_modules, so this resolves modules the way the runner does.
          cd /tmp/pkg/src
          node --test aws/tests/claim-ledger-accepted-contract.test.mjs aws/tests/tenant-security-compliance.test.mjs aws/tests/api-write.test.mjs
      - name: Compress package
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          cd /tmp/pkg
          tar -czf "source-${SHA}.tar.gz" -C src .
          sha256sum "source-${SHA}.tar.gz" | tee "source-${SHA}.tar.gz.sha256"
      - name: Assume temporary artifact-upload-only role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::806168576068:role/ChecksOpsGitHubSql53ArtifactUpload
          aws-region: us-east-1
          role-session-name: sql53-reviewed-package-upload
      - name: Upload reviewed source only
        shell: bash
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          for f in "source-${SHA}.tar.gz" "source-${SHA}.tar.gz.sha256"; do
            aws s3 cp "/tmp/pkg/${f}" "s3://checksops-sql53-transfer-806168576068/sql53/${f}" --sse AES256 --no-progress
          done
          aws s3api head-object --bucket checksops-sql53-transfer-806168576068 --key "sql53/source-${SHA}.tar.gz" --query '{ContentLength:ContentLength,ServerSideEncryption:ServerSideEncryption}' --output json
