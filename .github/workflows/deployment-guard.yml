name: Deployment guard

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run deployment-guard tests (no AWS)
        run: node --test aws/tests/deployment-guard.test.mjs aws/tests/deployment-guard-enforcement.test.mjs aws/tests/deployment-guard-adversarial.test.mjs aws/tests/claim-ledger-accepted-contract.test.mjs aws/tests/protected-composition.test.mjs aws/tests/moov-claim-ledger-spa-composition.test.mjs

      - name: Scan for unregistered shared-target writers
        run: node scripts/deployment-guard/scan-bypass.mjs

      - name: Evaluate-only preflight smoke (no AWS, skip contracts)
        run: |
          node scripts/deployment-guard/manifest.mjs --json '{"workstream_id":"ci-smoke","branch":"ci","commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","target_environment":"staging","deployment_type":"verify-only","owned_components":["ci"],"preflight_live_fingerprint":{"ok":true},"build_timestamp":"2026-09-29T00:00:00Z"}'
