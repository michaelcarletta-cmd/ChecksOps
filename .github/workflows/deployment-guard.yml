name: Deployment guard

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deployment-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      # The PostgreSQL 16 cases (aws/tests/helpers/stakeholder-policies-pg.mjs) need the pg
      # module and /usr/lib/postgresql/16/bin. pg is pinned to the version in package-lock.json
      # and aws/functions/api; it is installed outside the checkout and moved in, so neither
      # package.json nor any lockfile changes and no other dependency is installed.
      - name: Install pg for the PostgreSQL 16 cases (pinned, no lockfile change)
        run: |
          npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/pg" pg@8.23.0
          test ! -e node_modules
          mv "$RUNNER_TEMP/pg/node_modules" node_modules
          node -e "const v = require('pg/package.json').version; if (v !== '8.23.0') throw new Error('pg ' + v); console.log('pg', v)"
          git diff --exit-code -- package.json package-lock.json aws/functions/api/package.json aws/functions/api/package-lock.json

      - name: Check PostgreSQL 16 binaries for the PG cases
        run: |
          if [ -x /usr/lib/postgresql/16/bin/initdb ]; then
            /usr/lib/postgresql/16/bin/initdb --version
          else
            echo "::warning::/usr/lib/postgresql/16/bin/initdb is missing on this runner; the PostgreSQL 16 cases will skip"
          fi

      - name: Run deployment-guard tests (no AWS)
        run: node --test aws/tests/deployment-guard.test.mjs aws/tests/deployment-guard-enforcement.test.mjs aws/tests/deployment-guard-adversarial.test.mjs aws/tests/aws-adapter-live.test.mjs aws/tests/github-staging-lambda-overlay.test.mjs aws/tests/lambda-overlay-apply-writer.test.mjs aws/tests/production-spa-upload-writer.test.mjs aws/tests/production-cors-writer.test.mjs aws/tests/cors-staging-acceptance.test.mjs aws/tests/sql-executor-auth.test.mjs aws/tests/sql53-staging-apply.test.mjs aws/tests/sql53-executor.test.mjs aws/tests/sql53-executor-reconcile.test.mjs aws/tests/guarded-sql-executor.test.mjs aws/tests/function-def-lookup.test.mjs aws/tests/function-def-create-inspect.test.mjs aws/tests/claim-ledger-accepted-contract.test.mjs aws/tests/production-readonly-inspect.test.mjs aws/tests/sql53-production-readonly-inspect.test.mjs aws/tests/sql53-production-apply.test.mjs aws/tests/ledger-production-apply.test.mjs aws/tests/sql72-production-apply.test.mjs aws/tests/sql-member-stakeholder-production-apply.test.mjs aws/tests/sql80-checkalt-production-apply.test.mjs aws/tests/sql81-checkalt-production-apply.test.mjs aws/tests/sql82-sql83-homeowner-executor.test.mjs aws/tests/sql82-sql83-homeowner-production-apply.test.mjs aws/tests/sql84-sql86-mortgage-executor.test.mjs aws/tests/sql84-sql86-mortgage-production-apply.test.mjs aws/tests/sql87-resolve-check-case-executor.test.mjs aws/tests/sql87-resolve-check-case-production-apply.test.mjs aws/tests/sql88-claim-id-assign-case-executor.test.mjs aws/tests/sql88-claim-id-assign-case-production-apply.test.mjs aws/tests/sql89-check-intake-column-update-executor.test.mjs aws/tests/sql89-check-intake-column-update-production-apply.test.mjs aws/tests/sql29-sql30-library-executor.test.mjs aws/tests/sql29-sql30-library-production-apply.test.mjs aws/tests/release-sql90-97-executor.test.mjs aws/tests/release-sql90-97-production-apply.test.mjs aws/tests/release-sql98-100-executor.test.mjs aws/tests/release-sql98-100-production-apply.test.mjs aws/tests/release-sql101-executor.test.mjs aws/tests/release-sql101-production-apply.test.mjs aws/tests/release-sql102-executor.test.mjs aws/tests/release-sql102-production-apply.test.mjs aws/tests/release-sql103-executor.test.mjs aws/tests/release-sql103-production-apply.test.mjs aws/tests/release-sql104-executor.test.mjs aws/tests/release-sql104-production-apply.test.mjs aws/tests/release-sql105-executor.test.mjs aws/tests/release-sql105-production-apply.test.mjs aws/tests/production-sql-inspect-hygiene.test.mjs aws/tests/mortgage-desk-access-production-inspect.test.mjs aws/tests/mortgage-executor-commit-outcome.test.mjs aws/tests/github-production-spa-upload.test.mjs

      - name: Scan for unregistered shared-target writers
        run: node scripts/deployment-guard/scan-bypass.mjs

      - name: Evaluate-only preflight smoke (no AWS, skip contracts)
        run: |
          node scripts/deployment-guard/manifest.mjs --json '{"workstream_id":"ci-smoke","branch":"ci","commit":"aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa","target_environment":"staging","deployment_type":"verify-only","owned_components":["ci"],"preflight_live_fingerprint":{"ok":true},"build_timestamp":"2026-09-29T00:00:00Z"}'
