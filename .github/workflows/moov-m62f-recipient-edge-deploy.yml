# M6.2F: deploy ONLY the four merged #204 recipient Edge Functions
# to production project nbcqwpysqgyxrrbgtmkw.
#
# This workflow must never deploy other functions, prune, or target
# staging / preview project refs. Preview environment is used only as a
# fallback secret source; --project-ref is always production.
name: M6.2F recipient edge deploy

on:
  push:
    branches:
      - cursor/moov-m62f-edge-deploy-a508
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moov-m62f-recipient-edge-deploy
  cancel-in-progress: false

jobs:
  deploy-from-repo-secret:
    name: Deploy with repo SUPABASE_ACCESS_TOKEN
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployed: ${{ steps.result.outputs.deployed }}
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        if: ${{ env.SUPABASE_ACCESS_TOKEN != '' }}
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy four recipient functions
        id: result
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "deployed=false" >> "$GITHUB_OUTPUT"
            echo "Repo secret SUPABASE_ACCESS_TOKEN is empty; will try Preview environment next."
            exit 0
          fi
          chmod +x scripts/m62f-deploy-recipient-edge.sh
          scripts/m62f-deploy-recipient-edge.sh
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Fingerprint live public functions
        if: steps.result.outputs.deployed == 'true'
        run: python3 scripts/m62f-fingerprint-recipient-edge.py

  deploy-from-preview-secret:
    name: Deploy with Preview environment token
    needs: deploy-from-repo-secret
    if: needs.deploy-from-repo-secret.outputs.deployed != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      PRODUCTION_PROJECT_REF: nbcqwpysqgyxrrbgtmkw
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require Preview token
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::No SUPABASE_ACCESS_TOKEN in repo secrets or Preview environment. Add a management PAT (sbp_...) named SUPABASE_ACCESS_TOKEN. Do not use the publishable key or service role."
            exit 1
          fi
          echo "Preview SUPABASE_ACCESS_TOKEN is present (length ${#SUPABASE_ACCESS_TOKEN})."

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy four recipient functions to production ref only
        run: |
          set -euo pipefail
          unset SUPABASE_PROJECT_ID || true
          chmod +x scripts/m62f-deploy-recipient-edge.sh
          scripts/m62f-deploy-recipient-edge.sh

      - name: Fingerprint live public functions
        run: python3 scripts/m62f-fingerprint-recipient-edge.py
