name: Guarded staging SQL executor

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "inspect the live executor, deploy main's executor package, or apply one allowlisted migration"
        required: true
        default: inspect
        type: choice
        options:
          - inspect
          - deploy
          - apply
      migration:
        description: "Allowlisted staging executor pin"
        required: true
        default: ledger-20261007193200
        type: choice
        options:
          - ledger-20261007193200
          - sql71-review-amount-grant
          - sql72-member-payment-writes
          - sql76-tenant-partnership-consent
      approved_commit:
        description: "Required for deploy/apply: exact main commit approved for this run"
        required: false
        default: ""
        type: string
      expected_executor_code_sha256:
        description: "Required for deploy/apply: live executor CodeSha256 from a prior inspect run"
        required: false
        default: ""
        type: string
      expected_live_definition_sha256:
        description: "Required for apply: live function definition SHA-256 from a fresh staging DB read-only diagnostic"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: guarded-staging-sql-executor
  cancel-in-progress: false

jobs:
  staging-sql:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact workflow commit with history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # Full history: the inventory accepts a live member only if main ever carried its bytes.
          fetch-depth: 0

      - name: Refuse non-main or unapproved mutation
        shell: bash
        # Inputs reach the script only through env, never as interpolated shell source.
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_APPROVED_COMMIT: ${{ inputs.approved_commit }}
          INPUT_EXPECTED_EXECUTOR_CODE_SHA256: ${{ inputs.expected_executor_code_sha256 }}
          INPUT_EXPECTED_LIVE_DEFINITION_SHA256: ${{ inputs.expected_live_definition_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Guarded staging SQL executor only runs from main"; exit 2; }
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Checkout SHA mismatch"; exit 2; }
          case "$INPUT_MODE" in
            inspect|deploy|apply) ;;
            *) echo "mode must be inspect, deploy, or apply"; exit 2 ;;
          esac
          if [ "$INPUT_MODE" != "inspect" ]; then
            [[ "$INPUT_APPROVED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "$INPUT_MODE requires approved_commit as a 40-character commit SHA"; exit 2; }
            test "$INPUT_APPROVED_COMMIT" = "$GITHUB_SHA" || { echo "main moved or approved commit does not match workflow SHA"; exit 2; }
            [[ "$INPUT_EXPECTED_EXECUTOR_CODE_SHA256" =~ ^[A-Za-z0-9+/]{43}=$ ]] || { echo "$INPUT_MODE requires expected_executor_code_sha256 from inspect"; exit 2; }
          fi
          if [ "$INPUT_MODE" = "apply" ]; then
            [[ "$INPUT_EXPECTED_LIVE_DEFINITION_SHA256" =~ ^[0-9a-f]{64}$ ]] || { echo "apply requires expected_live_definition_sha256 as 64 hex characters"; exit 2; }
          fi

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Run deployment safety tests
        run: |
          node --test aws/tests/github-staging-sql-executor.test.mjs
          node --test aws/tests/ledger-20261007193200-executor.test.mjs
          node --test aws/tests/sql-executor-auth.test.mjs
          node --test aws/tests/sql72-member-payment-writes-executor.test.mjs
          node --test aws/tests/sql76-tenant-partnership-consent-executor.test.mjs
          node --test aws/tests/deployment-guard-kms-receipt.test.mjs
          node --test aws/tests/deployment-guard-signed-receipt.test.mjs
          node scripts/deployment-guard/scan-bypass.mjs

      - name: Validate staging OIDC inputs
        shell: bash
        env:
          STAGING_SQL_EXECUTOR_ROLE_ARN: ${{ vars.CHECKSOPS_STAGING_SQL_EXECUTOR_ROLE_ARN }}
        run: |
          set -euo pipefail
          test "$STAGING_SQL_EXECUTOR_ROLE_ARN" = "arn:aws:iam::806168576068:role/ChecksOpsGitHubStagingSqlExecutor" || { echo "CHECKSOPS_STAGING_SQL_EXECUTOR_ROLE_ARN does not match the dedicated staging SQL executor role"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_URL despite id-token: write"; exit 2; }
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" || { echo "GitHub did not provide ACTIONS_ID_TOKEN_REQUEST_TOKEN despite id-token: write"; exit 2; }

      # Each mode narrows the role to what that mode needs with an inline session policy.
      - name: Configure read-only executor session (inspect)
        if: ${{ inputs.mode == 'inspect' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_SQL_EXECUTOR_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-sql-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["lambda:GetFunction","lambda:GetFunctionConfiguration"],"Resource":"arn:aws:lambda:us-east-1:806168576068:function:checksops-staging-guarded-sql-executor"}]}

      - name: Configure executor deploy session (deploy)
        if: ${{ inputs.mode == 'deploy' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_SQL_EXECUTOR_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-sql-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["lambda:GetFunction","lambda:GetFunctionConfiguration","lambda:UpdateFunctionCode","lambda:UpdateFunctionConfiguration"],"Resource":"arn:aws:lambda:us-east-1:806168576068:function:checksops-staging-guarded-sql-executor"},{"Effect":"Allow","Action":["lambda:GetFunctionConfiguration"],"Resource":["arn:aws:lambda:us-east-1:806168576068:function:checksops-staging-rehearsal-oneshot","arn:aws:lambda:us-east-1:806168576068:function:checksops-staging-api"]}]}

      - name: Configure executor invoke session (apply)
        if: ${{ inputs.mode == 'apply' }}
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
        with:
          role-to-assume: ${{ vars.CHECKSOPS_STAGING_SQL_EXECUTOR_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: checksops-staging-sql-${{ github.run_id }}
          inline-session-policy: >-
            {"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["lambda:GetFunction","lambda:GetFunctionConfiguration","lambda:InvokeFunction"],"Resource":"arn:aws:lambda:us-east-1:806168576068:function:checksops-staging-guarded-sql-executor"},{"Effect":"Allow","Action":["kms:Sign","kms:GetPublicKey"],"Resource":"*"}]}

      - name: Verify AWS identity
        shell: bash
        run: |
          set -euo pipefail
          ACCOUNT="$(aws sts get-caller-identity --query Account --output text)"
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          test "$ACCOUNT" = "806168576068" || { echo "Unexpected AWS account"; exit 2; }
          test "$ARN" = "arn:aws:sts::806168576068:assumed-role/ChecksOpsGitHubStagingSqlExecutor/checksops-staging-sql-$GITHUB_RUN_ID" || { echo "Unexpected AWS role identity"; exit 2; }

      - name: Load staging KMS verifier
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          KMS_KEY_ARN: ${{ vars.CHECKSOPS_STAGING_DEPLOYMENT_GUARD_KMS_KEY_ARN }}
        run: |
          set -euo pipefail
          test -n "$KMS_KEY_ARN" || { echo "staging deployment-guard KMS key ARN is missing"; exit 2; }
          case "$KMS_KEY_ARN" in
            arn:aws:kms:us-east-1:*:key/*) ;;
            *) echo "invalid staging deployment-guard KMS key ARN"; exit 2 ;;
          esac
          PUBLIC_KEY_B64="$(aws kms get-public-key --region us-east-1 --key-id "$KMS_KEY_ARN" --query PublicKey --output text)"
          test -n "$PUBLIC_KEY_B64" || { echo "KMS public key is missing"; exit 2; }
          {
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_KEY_ARN=$KMS_KEY_ARN"
            echo "CHECKSOPS_DEPLOYMENT_GUARD_KMS_PUBLIC_KEY_DER_B64=$PUBLIC_KEY_B64"
            echo "CHECKSOPS_BUILD_TIMESTAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"

      - name: Inventory live executor and authorize
        id: preflight
        shell: bash
        env:
          CHECKSOPS_SQL_EXECUTOR_MODE: ${{ inputs.mode }}
          CHECKSOPS_SQL_EXECUTOR_MIGRATION: ${{ inputs.migration }}
          CHECKSOPS_EXPECTED_EXECUTOR_CODE_SHA256: ${{ inputs.expected_executor_code_sha256 }}
          CHECKSOPS_EXPECTED_LIVE_DEFINITION_SHA256: ${{ inputs.expected_live_definition_sha256 }}
        run: node scripts/deployment-guard/github-staging-sql-executor.mjs

      - name: Record inspected executor state
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          LIVE_CODE_SHA256: ${{ steps.preflight.outputs.live_code_sha256 }}
          LIVE_LAST_MODIFIED: ${{ steps.preflight.outputs.live_last_modified }}
          EXECUTOR_CURRENT: ${{ steps.preflight.outputs.executor_current }}
          SUPERSEDED: ${{ steps.preflight.outputs.superseded_members }}
          ADDED: ${{ steps.preflight.outputs.added_members }}
        run: |
          {
            echo "### Staging SQL executor preflight"
            echo "- Mode: \`$INPUT_MODE\`"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Live executor CodeSha256: \`$LIVE_CODE_SHA256\`"
            echo "- Live LastModified: \`$LIVE_LAST_MODIFIED\`"
            echo "- Live executor already carries main's package: \`$EXECUTOR_CURRENT\`"
            echo "- Members main supersedes: \`$SUPERSEDED\`"
            echo "- Members main adds: \`$ADDED\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy main's executor through the official ensure script
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment-guard/sql-executor-ensure.mjs \
            --function-name checksops-staging-guarded-sql-executor \
            --workstream-id "github-staging-sql-$GITHUB_RUN_ID" \
            --commit "$GITHUB_SHA"

      - name: Verify live executor now carries main's package
        if: ${{ inputs.mode == 'deploy' }}
        shell: bash
        env:
          CHECKSOPS_SQL_EXECUTOR_MODE: inspect
          CHECKSOPS_SQL_EXECUTOR_MIGRATION: ${{ inputs.migration }}
          CHECKSOPS_REQUIRE_EXECUTOR_CURRENT: "1"
        run: |
          set -euo pipefail
          node scripts/deployment-guard/github-staging-sql-executor.mjs > deployed.json
          echo "- Deployed executor CodeSha256: \`$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('deployed.json','utf8')).live_executor.code_sha256)")\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply through the official receipt-gated executor invoke
        if: ${{ inputs.mode == 'apply' }}
        shell: bash
        env:
          CHECKSOPS_DEPLOYMENT_GUARD_APPLY: "1"
          CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT: ${{ steps.preflight.outputs.receipt_path }}
          INVOKE_INPUT: ${{ steps.preflight.outputs.input_path }}
          CHECKSOPS_WORKSTREAM_ID: ${{ steps.preflight.outputs.workstream_id }}
          PIN_COMMIT: ${{ steps.preflight.outputs.pin_commit }}
        run: |
          set -euo pipefail
          node scripts/deployment-guard/sql-executor-invoke.mjs \
            --input "$INVOKE_INPUT" \
            --receipt "$CHECKSOPS_DEPLOYMENT_GUARD_RECEIPT" \
            --workstream-id "$CHECKSOPS_WORKSTREAM_ID" \
            --commit "$PIN_COMMIT" > invoke.json
          node -e "
            const r = JSON.parse(require('fs').readFileSync('invoke.json', 'utf8'));
            const receipt = r.details && r.details.details && r.details.details.receipt;
            if (!r.ok || !receipt || receipt.result !== 'applied') { console.error(JSON.stringify(r, null, 2)); process.exit(2); }
            console.log(JSON.stringify(receipt, null, 2));
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              '- Applied: before \`' + receipt.before_hash + '\` after \`' + receipt.after_hash + '\`\n');
          "

      - name: Cleanup ephemeral deployment-guard state
        if: ${{ always() }}
        run: rm -rf .deployment-guard deployed.json invoke.json
