AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ChecksOps AWS staging HTTPS frontend (CloudFront + ACM + S3 OAC).
  Staging-only. Does not modify production DNS, Lovable, or Supabase.
  Deploy after IAM grants ACM/CloudFront permissions. DNS validation in Cloudflare
  is required before the certificate and alias become usable. Do not edit apex/www.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues: [staging]
  FrontendBucketName:
    Type: String
    Default: checksops-staging-frontend-c48b
    Description: Existing staging SPA bucket (vite aws build). Kept private; CloudFront OAC only.
  StagingHostname:
    Type: String
    Default: staging.checksops.com
    Description: Dedicated staging hostname. Must not be checksops.com or www.checksops.com.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]

Resources:
  StagingFrontendCertificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref StagingHostname
      ValidationMethod: DNS
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Purpose
          Value: checksops-staging-https-frontend

  StagingFrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub checksops-${Environment}-frontend-oac
        Description: OAC for staging SPA bucket (no public website required)
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  StagingFrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub checksops-${Environment} SPA for ${StagingHostname}
        Enabled: true
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases:
          - !Ref StagingHostname
        ViewerCertificate:
          AcmCertificateArn: !Ref StagingFrontendCertificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        DefaultRootObject: index.html
        Origins:
          - Id: StagingSpaS3
            DomainName: !Sub ${FrontendBucketName}.s3.us-east-1.amazonaws.com
            OriginAccessControlId: !GetAtt StagingFrontendOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: StagingSpaS3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          OriginRequestPolicyId: 88a5eaf4-2fd4-4709-b370-b4c650ea3fcf # CORS-S3Origin
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Name
          Value: !Sub checksops-${Environment}-frontend

  StagingFrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucketName
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontOACRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucketName}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${StagingFrontendDistribution}

Outputs:
  StagingHostname:
    Value: !Ref StagingHostname
  CertificateArn:
    Value: !Ref StagingFrontendCertificate
  CloudFrontDistributionId:
    Value: !Ref StagingFrontendDistribution
  CloudFrontDomainName:
    Value: !GetAtt StagingFrontendDistribution.DomainName
  OriginAccessControlId:
    Value: !GetAtt StagingFrontendOAC.Id
  DnsCheckpoint:
    Description: Stop here — add ACM validation + staging CNAME in Cloudflare (DNS-only), never apex/www.
    Value: !Sub |
      1) Complete ACM DNS validation for ${StagingHostname} (see ACM console CNAME name/value).
      2) Create Cloudflare CNAME ${StagingHostname} -> ${StagingFrontendDistribution.DomainName} with proxy DNS-only initially.
      3) Do not modify checksops.com or www.checksops.com.
