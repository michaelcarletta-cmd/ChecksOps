AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ChecksOps AWS staging foundation. Does not modify production Supabase. Does not create or import the existing checksops-staging RDS instance.

Parameters:
  Environment:
    Type: String
    Default: staging
    AllowedValues:
      - staging
    Description: Staging-only until cutover is explicitly approved. Production is not an allowed value.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Default: vpc-09f2268778966ce97
    Description: Existing VPC that already hosts the checksops-staging RDS instance.
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Default: subnet-092e4e41821fba6c4,subnet-0df2518070c5b9ff0
    Description: Existing subnets for the API Lambda ENIs. Includes us-east-1f (RDS AZ) and us-east-1a.
  ExistingRdsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Default: sg-0e9332faa87c1d059
    Description: Existing RDS security group rds-ec2-1. This stack only adds a 5432 ingress rule from the Lambda SG.
  DatabaseSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:806168576068:secret:rds-db-credentials/checksops-staging/checksops/1788286468693-b4U0Rn
    Description: Application DB credential secret ARN (checksops user). Do not use the checksops_admin secret. This is an ARN, not a password.
  S3RouteTableId:
    Type: String
    Default: rtb-0b92eeeb4ce2759c8
    Description: Existing main route table for the RDS VPC. Used by the S3 gateway endpoint.
  S3ManagedPrefixListId:
    Type: String
    Default: pl-63a5400a
    Description: AWS-managed prefix list for com.amazonaws.us-east-1.s3. Used for Lambda HTTPS egress to S3 via the gateway endpoint.
  PublicSubnetId:
    Type: String
    Default: ''
    Description: Optional public subnet (IGW route) for a staging NAT Gateway. Empty skips NAT creation so a SAM update cannot attach 0.0.0.0/0 to a public route table by accident.
  PrivateRouteTableId:
    Type: String
    Default: ''
    Description: Optional private route table for Lambda subnets. Used only when PublicSubnetId is set. Must not be a route table that already has 0.0.0.0/0 → igw.
  # Live Lambda overlay env values that must survive SAM updates. Pass at deploy time;
  # NoEcho keeps secret material out of CloudFormation console display and out of git.
  MoovWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Staging AWS_MOOV_WEBHOOK_SECRET. Provide from live Lambda env at deploy; do not commit the value.
  CheckAltWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Staging AWS_CHECKALT_WEBHOOK_SECRET. Provide from live Lambda env at deploy; do not commit the value.
  PlaidWebhookSecret:
    Type: String
    NoEcho: true
    Default: ''
    Description: Staging AWS_PLAID_WEBHOOK_SECRET. Provide from live Lambda env at deploy; do not commit the value.
  SandboxSecretEpoch:
    Type: String
    NoEcho: true
    Default: ''
    Description: Staging CHECKSOPS_SANDBOX_SECRET_EPOCH. Provide from live Lambda env at deploy; do not commit the value.
  CreateKmsVpcEndpoint:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Create a KMS interface endpoint (PrivateDnsEnabled) for onboarding PII encryption. Leave false if the VPC already has one; then KMS is reached through the NAT.

Conditions:
  CreateKmsEndpoint: !Equals [!Ref CreateKmsVpcEndpoint, 'true']
  IsProductionEnvironment: !Equals [!Ref Environment, production]
  CreateStagingNat: !And
    - !Not [!Equals [!Ref PublicSubnetId, '']]
    - !Not [!Equals [!Ref PrivateRouteTableId, '']]

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    Timeout: 29
    MemorySize: 1024
    Tracing: Active
    Environment:
      Variables:
        CHECKSOPS_ENV: !Ref Environment
        FILES_BUCKET: !Ref PrivateFilesBucket
        PROVIDER_SECRETS_ARN: !Ref ProviderSecrets
        DATABASE_SECRET_ARN: !Ref DatabaseSecretArn
        # Staging restored DB target; keep app role secret unchanged.
        DATABASE_NAME: checksops
        COGNITO_USER_POOL_ID: !Ref ChecksOpsUserPool
        COGNITO_CLIENT_ID: !Ref ChecksOpsUserPoolClient
        # WebAuthn origin stays staging until a separately approved production pool exists.
        COGNITO_WEBAUTHN_ORIGIN: "https://staging.checksops.com"
        COGNITO_WEBAUTHN_RP_ID: "staging.checksops.com"
        SIGN_BASE_URL: "https://staging.checksops.com"
        # Staging-safe application mail. Default is sink; do not grant email-send IAM here.
        AWS_EMAIL_MODE: "sink"
        AWS_EMAIL_FROM: "ChecksOps Staging <noreply@checksops.com>"
        AWS_EMAIL_REPLY_TO: "support@checksops.com"
        AWS_EMAIL_SINK_ADDRESS: "staging-sink@checksops.invalid"
        AWS_EMAIL_ALLOWLIST_DOMAINS: "checksops.invalid,checksops.com,freedomadj.com"
        AWS_EMAIL_ALLOWLIST_EXACT: "staging-master@checksops.invalid,mcarletta@freedomadj.com,checksops-tester@freedomadj.com"
        AWS_MORTGAGE_OPS_EMAIL: "staging-mortgage-ops@checksops.invalid"
        # Tenant SES domain APIs stay off. Do not grant SES IAM in this stack.
        AWS_TENANT_EMAIL_DOMAIN_ENABLED: "false"
        AWS_SES_CONFIGURATION_SET: ""
        AWS_TENANT_SES_IDENTITY_DELETE_ENABLED: "false"
        AWS_TENANT_MAIL_FROM_ENABLED: "false"
        AWS_COGNITO_MFA_PREFERRED: "false"
        # Preserve live staging write/workflow overlay behavior.
        AWS_WRITES_ENABLED: "true"
        AWS_CHECK_WORKFLOW_WRITES_ENABLED: "true"
        AWS_STORAGE_WRITES_ENABLED: "true"
        AWS_APPLICATION_WORKFLOW_WRITES_ENABLED: "true"
        AWS_FINANCIAL_SANDBOX_SIMULATION_ENABLED: "true"
        # Safety / production-execution flags stay disabled.
        AWS_PROVIDER_EXECUTION_ENABLED: "false"
        AWS_MOOV_ENABLED: "false"
        AWS_CHECKALT_ENABLED: "false"
        AWS_PLAID_ENABLED: "false"
        AWS_ACTUM_ENABLED: "false"
        AWS_QUICKBOOKS_ENABLED: "false"
        AWS_PROVIDER_LIVE_READS_ENABLED: "false"
        AWS_PROVIDER_WEBHOOK_DRY_RUN: "true"
        AWS_PROVIDER_SANDBOX_EXECUTION_ENABLED: "true"
        AWS_FINANCIAL_PERMISSIONS_ACTIVATED: "false"
        # Moov onboarding (Compliance & Docs). Production onboarding stays off;
        # staging uses Moov sandbox through AWS_PROVIDER_SANDBOX_EXECUTION_ENABLED.
        AWS_MOOV_ONBOARDING_PRODUCTION_ENABLED: "false"
        MOOV_ONBOARDING_PII_KMS_KEY_ARN: !GetAtt MoovOnboardingPiiKey.Arn
        COMPLIANCE_DOCUMENTS_KMS_KEY_ARN: !GetAtt ComplianceDocumentsKey.Arn
        # Webhook HMAC / sandbox epoch preserved via NoEcho parameters (not stored in git).
        AWS_MOOV_WEBHOOK_SECRET: !Ref MoovWebhookSecret
        AWS_CHECKALT_WEBHOOK_SECRET: !Ref CheckAltWebhookSecret
        AWS_PLAID_WEBHOOK_SECRET: !Ref PlaidWebhookSecret
        CHECKSOPS_SANDBOX_SECRET_EPOCH: !Ref SandboxSecretEpoch

Resources:
  ChecksOpsApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - authorization
          - content-type
          - x-request-id
          - x-bridge-secret
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS

  ApiLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      # Exact live CloudFormation GroupDescription. Changing this string replaces the SG.
      GroupDescription: Dedicated checksops-staging-api Lambda SG. No inbound. Egress only to RDS 5432, Secrets Manager endpoint, and S3 prefix list.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          DestinationSecurityGroupId: !Ref ExistingRdsSecurityGroupId
          Description: PostgreSQL to existing RDS security group
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          DestinationPrefixListId: !Ref S3ManagedPrefixListId
          Description: HTTPS to S3 via gateway endpoint prefix list
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to Moov and CheckAlt UAT via staging NAT. No inbound. Does not change the RDS security group.
      Tags:
        - Key: Name
          Value: !Sub checksops-${Environment}-api-lambda
        - Key: Environment
          Value: !Ref Environment

  VpcEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS 443 from checksops-staging-api Lambda to the Secrets Manager VPC endpoint.
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: !Sub checksops-${Environment}-vpce-secrets
        - Key: Environment
          Value: !Ref Environment

  LambdaToSecretsEndpointEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref ApiLambdaSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      DestinationSecurityGroupId: !Ref VpcEndpointSecurityGroup
      Description: HTTPS to Secrets Manager interface endpoint

  SecretsEndpointFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref VpcEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref ApiLambdaSecurityGroup
      Description: HTTPS from API Lambda

  RdsFromLambdaIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref ExistingRdsSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref ApiLambdaSecurityGroup
      Description: PostgreSQL from checksops-staging-api Lambda only

  StagingNatEip:
    Type: AWS::EC2::EIP
    Condition: CreateStagingNat
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub checksops-${Environment}-nat
        - Key: Environment
          Value: !Ref Environment

  StagingNatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateStagingNat
    Properties:
      AllocationId: !GetAtt StagingNatEip.AllocationId
      SubnetId: !Ref PublicSubnetId
      Tags:
        - Key: Name
          Value: !Sub checksops-${Environment}-nat
        - Key: Environment
          Value: !Ref Environment

  StagingPrivateInternetRoute:
    Type: AWS::EC2::Route
    Condition: CreateStagingNat
    Properties:
      RouteTableId: !Ref PrivateRouteTableId
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref StagingNatGateway

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup

  S3VpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref S3RouteTableId
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - s3:ListBucket
              - s3:AbortMultipartUpload
            Resource:
              - !GetAtt PrivateFilesBucket.Arn
              - !Sub ${PrivateFilesBucket.Arn}/*

  ApiFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - SecretsManagerVpcEndpoint
      - S3VpcEndpoint
      - RdsFromLambdaIngress
      - LambdaToSecretsEndpointEgress
      - SecretsEndpointFromLambdaIngress
    Properties:
      FunctionName: !Sub checksops-${Environment}-api
      CodeUri: functions/api/
      Handler: index.handler
      Description: ChecksOps AWS API staging entrypoint
      VpcConfig:
        SecurityGroupIds:
          - !Ref ApiLambdaSecurityGroup
        SubnetIds: !Ref SubnetIds
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PrivateFilesBucket
        - S3WritePolicy:
            BucketName: !Ref PrivateFilesBucket
        - VPCAccessPolicy: {}
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref ProviderSecrets
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !Ref DatabaseSecretArn
        - Statement:
            # EIN / representative DOB field encryption, bound to the tenant via encryption context.
            - Sid: MoovOnboardingPiiEncryptDecrypt
              Effect: Allow
              Action:
                - kms:Encrypt
                - kms:Decrypt
              Resource: !GetAtt MoovOnboardingPiiKey.Arn
              Condition:
                StringEquals:
                  kms:EncryptionContext:app: checksops-moov-onboarding
            # Compliance documents: version-pinned reads and permanent removal of a rejected version.
            - Sid: ComplianceDocumentObjects
              Effect: Allow
              Action:
                - s3:GetObjectVersion
                - s3:DeleteObject
                - s3:DeleteObjectVersion
              Resource: !Sub ${PrivateFilesBucket.Arn}/files/verification-docs/*
            # Compliance documents: SSE-KMS through S3 only (finalize reads, view presigns).
            - Sid: ComplianceDocumentsViaS3
              Effect: Allow
              Action:
                - kms:GenerateDataKey
                - kms:Decrypt
              Resource: !GetAtt ComplianceDocumentsKey.Arn
              Condition:
                StringEquals:
                  kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
      Events:
        Root:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChecksOpsApi
            Path: /
            Method: ANY
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref ChecksOpsApi
            Path: /{proxy+}
            Method: ANY

  PrivateFilesBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      # Browser PUT/GET with presigned URLs (compliance documents and existing
      # storage uploads). Replaces any live CORS config: check it before deploy.
      CorsConfiguration:
        CorsRules:
          - Id: SpaPresignedUploads
            # Staging stack: the staging SPA only; production stack: production SPA only.
            AllowedOrigins: !If
              - IsProductionEnvironment
              - - https://checksops.com
                - https://www.checksops.com
              - - https://staging.checksops.com
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - content-type
              - content-length
              - x-amz-server-side-encryption
              - x-amz-server-side-encryption-aws-kms-key-id
            ExposedHeaders:
              - ETag
              - x-amz-version-id
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          # Upload keys are scratch space (finalize copies to final/ and deletes
          # the verified version); late or abandoned uploads expire.
          - Id: ComplianceDocumentUploadsExpire
            Status: Enabled
            Prefix: files/verification-docs/uploads/
            ExpirationInDays: 1
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
          - Id: ComplianceDocumentsExpireNoncurrentVersions
            Status: Enabled
            Prefix: files/verification-docs/final/
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  # Dedicated key for onboarding PII that ChecksOps keeps (EIN, representative DOB).
  # Root (IAM) gets explicit key administration only (PutKeyPolicy kept so the
  # key cannot be locked out; no CreateGrant, Encrypt or Decrypt). Use is
  # limited to the API function role (matched by name so the key does not
  # depend on the SAM-generated role) and to the onboarding encryption context.
  MoovOnboardingPiiKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: ChecksOps Moov onboarding PII field encryption (EIN, representative DOB). Full SSNs are never stored.
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: KeyAdministrationOnly
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:ListAliases
              - kms:ListGrants
              - kms:GetKeyRotationStatus
              - kms:EnableKeyRotation
              - kms:DisableKeyRotation
              - kms:RotateKeyOnDemand
              - kms:ListKeyRotations
              - kms:EnableKey
              - kms:DisableKey
              - kms:UpdateKeyDescription
              - kms:CreateAlias
              - kms:UpdateAlias
              - kms:DeleteAlias
              - kms:RevokeGrant
              - kms:RetireGrant
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: ApiFunctionRoleFieldEncryption
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:Encrypt
              - kms:Decrypt
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-ApiFunctionRole-*
              StringEquals:
                kms:EncryptionContext:app: checksops-moov-onboarding
              ForAllValues:StringEquals:
                kms:EncryptionContextKeys:
                  - app
                  - environment
                  - tenant_id
                  - field

  MoovOnboardingPiiKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/checksops-${Environment}-moov-onboarding-pii
      TargetKeyId: !Ref MoovOnboardingPiiKey

  # Dedicated key for compliance documents under files/verification-docs/.
  # Use only by the API function role, and only through S3 (SSE-KMS).
  ComplianceDocumentsKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: ChecksOps compliance documents (SSE-KMS) under files/verification-docs/.
      EnableKeyRotation: true
      KeySpec: SYMMETRIC_DEFAULT
      KeyUsage: ENCRYPT_DECRYPT
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: KeyAdministrationOnly
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:DescribeKey
              - kms:GetKeyPolicy
              - kms:PutKeyPolicy
              - kms:ListKeyPolicies
              - kms:ListResourceTags
              - kms:ListAliases
              - kms:ListGrants
              - kms:GetKeyRotationStatus
              - kms:EnableKeyRotation
              - kms:DisableKeyRotation
              - kms:RotateKeyOnDemand
              - kms:ListKeyRotations
              - kms:EnableKey
              - kms:DisableKey
              - kms:UpdateKeyDescription
              - kms:CreateAlias
              - kms:UpdateAlias
              - kms:DeleteAlias
              - kms:RevokeGrant
              - kms:RetireGrant
              - kms:TagResource
              - kms:UntagResource
              - kms:ScheduleKeyDeletion
              - kms:CancelKeyDeletion
            Resource: '*'
          - Sid: ApiFunctionRoleViaS3
            Effect: Allow
            Principal:
              AWS: !Sub arn:aws:iam::${AWS::AccountId}:root
            Action:
              - kms:GenerateDataKey
              - kms:Decrypt
            Resource: '*'
            Condition:
              ArnLike:
                aws:PrincipalArn: !Sub arn:aws:iam::${AWS::AccountId}:role/${AWS::StackName}-ApiFunctionRole-*
              StringEquals:
                kms:ViaService: !Sub s3.${AWS::Region}.amazonaws.com
              StringLike:
                kms:EncryptionContext:aws:s3:arn: !Sub arn:aws:s3:::${PrivateFilesBucket}/files/verification-docs/*

  ComplianceDocumentsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub alias/checksops-${Environment}-compliance-documents
      TargetKeyId: !Ref ComplianceDocumentsKey

  # NOTE: an AWS::S3::BucketPolicy REPLACES the bucket's whole live policy.
  # The template had no bucket policy; check the live bucket for existing
  # statements and merge them here before deploying.
  # Compliance documents must be written with SSE-KMS under the dedicated key.
  # The fixed prefix files/verification-docs/ is outside every generic storage
  # mapping (files/{bucket}/...), so it cannot match tenant library paths.
  PrivateFilesBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PrivateFilesBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ComplianceDocumentsRequireSseKms
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${PrivateFilesBucket.Arn}/files/verification-docs/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption: aws:kms
          - Sid: ComplianceDocumentsRequireDedicatedKey
            Effect: Deny
            Principal: '*'
            Action: s3:PutObject
            Resource: !Sub ${PrivateFilesBucket.Arn}/files/verification-docs/*
            Condition:
              StringNotEquals:
                s3:x-amz-server-side-encryption-aws-kms-key-id: !GetAtt ComplianceDocumentsKey.Arn

  # Optional: Lambda -> KMS without the NAT. Off by default because a second
  # KMS interface endpoint with PrivateDnsEnabled conflicts with an existing one
  # in the VPC; enable only after checking the live VPC.
  KmsVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateKmsEndpoint
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.kms
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref SubnetIds
      SecurityGroupIds:
        - !Ref VpcEndpointSecurityGroup
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: OnboardingKeysThisAccountOnly
            Effect: Allow
            Principal: '*'
            Action:
              - kms:Encrypt
              - kms:Decrypt
              - kms:GenerateDataKey
            Resource:
              - !GetAtt MoovOnboardingPiiKey.Arn
              - !GetAtt ComplianceDocumentsKey.Arn
            Condition:
              StringEquals:
                aws:PrincipalAccount: !Ref AWS::AccountId

  ChecksOpsUserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub checksops-${Environment}
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
        SignInPolicy:
          AllowedFirstAuthFactors:
            - EMAIL_OTP
            - PASSWORD
            - WEB_AUTHN

  ChecksOpsUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub checksops-${Environment}-web
      UserPoolId: !Ref ChecksOpsUserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      ExplicitAuthFlows:
        - ALLOW_USER_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_ADMIN_USER_PASSWORD_AUTH

  # Existing RDS instance checksops-staging is intentionally not declared here.
  ProviderSecrets:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub checksops/${Environment}/providers
      Description: ChecksOps provider credentials. Populate JSON in Secrets Manager after deploy. Do not set SecretString in this template; stack updates would overwrite live values.

Outputs:
  MoovOnboardingPiiKeyArn:
    Value: !GetAtt MoovOnboardingPiiKey.Arn
  ComplianceDocumentsKeyArn:
    Value: !GetAtt ComplianceDocumentsKey.Arn
  ApiUrl:
    Description: ChecksOps staging API URL
    Value: !Sub https://${ChecksOpsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
  ApiFunctionName:
    Value: !Ref ApiFunction
  FilesBucketName:
    Value: !Ref PrivateFilesBucket
  CognitoUserPoolId:
    Value: !Ref ChecksOpsUserPool
  CognitoWebClientId:
    Value: !Ref ChecksOpsUserPoolClient
  ProviderSecretsArn:
    Value: !Ref ProviderSecrets
  ApiLambdaSecurityGroupId:
