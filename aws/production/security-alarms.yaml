AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Operator-only CloudWatch alarms for Hardening Batch 5.
  The Cloud Agent role cannot cloudwatch:PutMetricAlarm.
  Deploy from a privileged ops role after SNS topic exists.

Parameters:
  AlertTopicArn:
    Type: String
    Default: ''
  PrepFunctionName:
    Type: String
    Default: checksops-production-prep-api
  HttpApiId:
    Type: String
    Default: kiqojucc02
  HttpApiStage:
    Type: String
    Default: prep
  FilesBucketName:
    Type: String
    Default: checksops-staging-privatefilesbucket-erzqsolpucjp
  RdsInstanceId:
    Type: String
    Default: checksops-staging
  UserPoolId:
    Type: String
    Default: us-east-1_h00WorYMT
  WafMetricName:
    Type: String
    Default: checksopsProductionCloudFrontWaf

Conditions:
  HasAlertTopic: !Not [!Equals [!Ref AlertTopicArn, '']]

Resources:
  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-lambda-errors
      AlarmDescription: Prep API Lambda error spike (detection).
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PrepFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  LambdaThrottlesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-lambda-throttles
      AlarmDescription: Prep API Lambda throttle (detection).
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref PrepFunctionName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-api-5xx
      AlarmDescription: HTTP API 5xx spike from AWS/ApiGateway metrics.
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  Api5xxFromLogsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-production-http-api-5xx-from-logs
      AlarmDescription: HTTP API access-log 5xx spike (requestId/status only; no payloads).
      Namespace: ChecksOps/ProductionPrep
      MetricName: PrepHttp5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  ApiAuthFailFromLogsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-production-http-api-auth-failures
      AlarmDescription: HTTP API 401/403 spike from access logs (auth anomaly signal).
      Namespace: ChecksOps/ProductionPrep
      MetricName: PrepAuthFailures
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  IamChangeAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-iam-security-changes
      AlarmDescription: IAM user/key/policy changes from CloudTrail management events.
      Namespace: ChecksOps/ProductionPrep
      MetricName: IamSecurityChanges
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  Api4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-api-4xx
      AlarmDescription: HTTP API 4xx spike (abuse / auth failures).
      Namespace: AWS/ApiGateway
      MetricName: 4xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApiId
        - Name: Stage
          Value: !Ref HttpApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 200
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  CognitoSignInThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-cognito-signin-throttles
      AlarmDescription: Cognito sign-in throttle spike (auth anomaly).
      Namespace: AWS/Cognito
      MetricName: SignInThrottles
      Dimensions:
        - Name: UserPool
          Value: !Ref UserPoolId
        - Name: UserPoolClient
          Value: 3ja9fqaq2fjkv3i6up2varcqpe
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  WafBlockedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-waf-blocked
      AlarmDescription: CloudFront WAF blocked-request spike (path rate limits).
      Namespace: AWS/WAFV2
      MetricName: BlockedRequests
      Dimensions:
        - Name: WebACL
          Value: !Ref WafMetricName
        - Name: Region
          Value: us-east-1
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  WafCountedAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-waf-counted
      AlarmDescription: CloudFront WAF counted-request spike (managed rules remain COUNT).
      Namespace: AWS/WAFV2
      MetricName: CountedRequests
      Dimensions:
        - Name: WebACL
          Value: !Ref WafMetricName
        - Name: Region
          Value: us-east-1
        - Name: Rule
          Value: ALL
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 200
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  RdsFreeStorageAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-rds-free-storage
      AlarmDescription: RDS free storage below 10 GiB.
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10737418240
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  RdsConnectionsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-rds-connections
      AlarmDescription: RDS connection count anomaly.
      Namespace: AWS/RDS
      MetricName: DatabaseConnections
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  RdsCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-rds-cpu
      AlarmDescription: RDS CPU availability pressure.
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref RdsInstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

  S3Files4xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: checksops-prod-s3-files-4xx
      AlarmDescription: Files-bucket 4xx spike (suspicious access). Needs S3 request metrics; missing data does not alarm.
      Namespace: AWS/S3
      MetricName: 4xxErrors
      Dimensions:
        - Name: BucketName
          Value: !Ref FilesBucketName
        - Name: FilterId
          Value: EntireBucket
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 50
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertTopic
        - - !Ref AlertTopicArn
        - !Ref AWS::NoValue

