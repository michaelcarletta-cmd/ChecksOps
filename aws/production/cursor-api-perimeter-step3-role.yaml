AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY Cursor Cloud OIDC role for API-behind-CloudFront Step 3
  origin verification only, plus the authorizer Lambda execution role.
  DO NOT DEPLOY FROM THIS PR. Do not create until a human sets
  DeployRole=true after review. Does not broaden
  ChecksOpsCursorCloudStaging. Does not delete or broaden
  ChecksOpsCursorApiPerimeterSteps12Temp. Does not recreate
  ChecksOpsCursorSecurityHardeningTemp or
  ChecksOpsCursorCloudTrailCwLogsTemp. Does not mutate the prep Lambda,
  SPA, WAF, DNS, Cognito, RDS, or financial/provider flags.

Parameters:
  DeployRole:
    Type: String
    Default: "false"
    AllowedValues: ["false", "true"]
    Description: Leave false. This PR must not create the roles.
  RoleName:
    Type: String
    Default: ChecksOpsCursorApiPerimeterStep3Temp
    AllowedValues:
      - ChecksOpsCursorApiPerimeterStep3Temp

Conditions:
  ShouldDeployRole: !Equals [!Ref DeployRole, "true"]

Resources:
  AllowPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ShouldDeployRole
    Properties:
      ManagedPolicyName: ChecksOpsCursorApiPerimeterStep3Allow
      Description: TEMPORARY allow CF origin header + origin-verify authorizer.
      PolicyDocument: {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "ReadAndUpdateNamedDistributionOrigin",
            "Effect": "Allow",
            "Action": [
              "cloudfront:GetDistribution",
              "cloudfront:GetDistributionConfig",
              "cloudfront:UpdateDistribution"
            ],
            "Resource": "arn:aws:cloudfront::806168576068:distribution/E1B0ZWWO5559U5"
          },
          {
            "Sid": "OriginVerifyLambdaOnly",
            "Effect": "Allow",
            "Action": [
              "lambda:CreateFunction",
              "lambda:UpdateFunctionCode",
              "lambda:UpdateFunctionConfiguration",
              "lambda:GetFunction",
              "lambda:GetFunctionConfiguration",
              "lambda:AddPermission",
              "lambda:RemovePermission",
              "lambda:GetPolicy",
              "lambda:TagResource",
              "lambda:ListTags"
            ],
            "Resource": [
              "arn:aws:lambda:us-east-1:806168576068:function:checksops-production-origin-verify",
              "arn:aws:lambda:us-east-1:806168576068:function:checksops-production-origin-verify:*"
            ]
          },
          {
            "Sid": "PassAuthorizerExecutionRole",
            "Effect": "Allow",
            "Action": "iam:PassRole",
            "Resource": "arn:aws:iam::806168576068:role/checksops-production-origin-verify",
            "Condition": {
              "StringEquals": {
                "iam:PassedToService": "lambda.amazonaws.com"
              }
            }
          },
          {
            "Sid": "ReadAuthorizerExecutionRole",
            "Effect": "Allow",
            "Action": [
              "iam:GetRole",
              "iam:GetRolePolicy"
            ],
            "Resource": "arn:aws:iam::806168576068:role/checksops-production-origin-verify"
          },
          {
            "Sid": "HttpApiAuthorizerRouteIntegrationOnly",
            "Effect": "Allow",
            "Action": [
              "apigateway:GET",
              "apigateway:POST",
              "apigateway:PATCH",
              "apigateway:DELETE"
            ],
            "Resource": [
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/authorizers",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/authorizers/*",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/routes",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/routes/*",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/integrations/jci10de"
            ]
          },
          {
            "Sid": "HttpApiReadOnly",
            "Effect": "Allow",
            "Action": "apigateway:GET",
            "Resource": [
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/*"
            ]
          },
          {
            "Sid": "OriginVerifySecretOnly",
            "Effect": "Allow",
            "Action": [
              "secretsmanager:CreateSecret",
              "secretsmanager:DescribeSecret",
              "secretsmanager:GetSecretValue",
              "secretsmanager:PutSecretValue"
            ],
            "Resource": "arn:aws:secretsmanager:us-east-1:806168576068:secret:checksops/production/cloudfront-origin-verify*"
          },
          {
            "Sid": "AuthorizerLogs",
            "Effect": "Allow",
            "Action": [
              "logs:CreateLogGroup",
              "logs:CreateLogStream",
              "logs:PutLogEvents",
              "logs:DescribeLogGroups",
              "logs:DescribeLogStreams",
              "logs:FilterLogEvents",
              "logs:GetLogEvents"
            ],
            "Resource": [
              "arn:aws:logs:us-east-1:806168576068:log-group:/aws/lambda/checksops-production-origin-verify",
              "arn:aws:logs:us-east-1:806168576068:log-group:/aws/lambda/checksops-production-origin-verify:*"
            ]
          },
          {
            "Sid": "ReadApiAccessLogsNoFormatChange",
            "Effect": "Allow",
            "Action": [
              "logs:DescribeLogStreams",
              "logs:FilterLogEvents",
              "logs:GetLogEvents"
            ],
            "Resource": "arn:aws:logs:us-east-1:806168576068:log-group:/aws/apigateway/checksops-production-prep-http:*"
          }
        ]
      }

  DenyPolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: ShouldDeployRole
    Properties:
      ManagedPolicyName: ChecksOpsCursorApiPerimeterStep3Deny
      Description: TEMPORARY deny RDS/Cognito/prep Lambda/WAF/DNS/financial.
      PolicyDocument: {
        "Version": "2012-10-17",
        "Statement": [
          {
            "Sid": "DenyCreateDeleteDistributions",
            "Effect": "Deny",
            "Action": [
              "cloudfront:DeleteDistribution",
              "cloudfront:CreateDistribution",
              "cloudfront:CreateDistributionWithTags",
              "cloudfront:CreateInvalidation"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyOtherDistributionUpdates",
            "Effect": "Deny",
            "Action": "cloudfront:UpdateDistribution",
            "NotResource": "arn:aws:cloudfront::806168576068:distribution/E1B0ZWWO5559U5"
          },
          {
            "Sid": "DenyWafMutation",
            "Effect": "Deny",
            "Action": ["wafv2:*", "waf:*", "waf-regional:*"],
            "Resource": "*"
          },
          {
            "Sid": "DenyApiLevelAndStageMutation",
            "Effect": "Deny",
            "Action": [
              "apigateway:POST",
              "apigateway:PATCH",
              "apigateway:DELETE",
              "apigateway:PUT"
            ],
            "Resource": [
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/stages",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/stages/*",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/cors"
            ]
          },
          {
            "Sid": "DenyOtherApis",
            "Effect": "Deny",
            "Action": "apigateway:*",
            "NotResource": [
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02",
              "arn:aws:apigateway:us-east-1::/apis/kiqojucc02/*"
            ]
          },
          {
            "Sid": "DenyOtherLambdas",
            "Effect": "Deny",
            "Action": "lambda:*",
            "NotResource": [
              "arn:aws:lambda:us-east-1:806168576068:function:checksops-production-origin-verify",
              "arn:aws:lambda:us-east-1:806168576068:function:checksops-production-origin-verify:*"
            ]
          },
          {
            "Sid": "DenyOtherSecrets",
            "Effect": "Deny",
            "Action": "secretsmanager:*",
            "NotResource": "arn:aws:secretsmanager:us-east-1:806168576068:secret:checksops/production/cloudfront-origin-verify*"
          },
          {
            "Sid": "DenySecretDestructive",
            "Effect": "Deny",
            "Action": [
              "secretsmanager:DeleteSecret",
              "secretsmanager:RotateSecret",
              "secretsmanager:CancelRotateSecret",
              "secretsmanager:RestoreSecret",
              "secretsmanager:PutResourcePolicy",
              "secretsmanager:DeleteResourcePolicy"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyRds",
            "Effect": "Deny",
            "Action": ["rds:*", "rds-data:*", "rds-db:*"],
            "Resource": "*"
          },
          {
            "Sid": "DenyCognito",
            "Effect": "Deny",
            "Action": "cognito-idp:*",
            "Resource": "*"
          },
          {
            "Sid": "DenyDns",
            "Effect": "Deny",
            "Action": ["route53:*", "route53domains:*"],
            "Resource": "*"
          },
          {
            "Sid": "DenyIamExceptPassNamedAuthorizerRole",
            "Effect": "Deny",
            "Action": [
              "iam:CreateRole",
              "iam:DeleteRole",
              "iam:UpdateRole",
              "iam:UpdateAssumeRolePolicy",
              "iam:PutRolePolicy",
              "iam:DeleteRolePolicy",
              "iam:AttachRolePolicy",
              "iam:DetachRolePolicy",
              "iam:CreatePolicy",
              "iam:CreatePolicyVersion",
              "iam:DeletePolicy",
              "iam:CreateUser",
              "iam:CreateAccessKey",
              "iam:AttachUserPolicy"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyPassRoleExceptAuthorizerExecution",
            "Effect": "Deny",
            "Action": "iam:PassRole",
            "NotResource": "arn:aws:iam::806168576068:role/checksops-production-origin-verify"
          },
          {
            "Sid": "DenyProtectedRoles",
            "Effect": "Deny",
            "Action": "iam:*",
            "Resource": [
              "arn:aws:iam::806168576068:role/ChecksOpsCursor*",
              "arn:aws:iam::806168576068:role/ChecksOpsCursorApiPerimeterSteps12Temp",
              "arn:aws:iam::806168576068:role/ChecksOpsCursorSecurityHardeningTemp",
              "arn:aws:iam::806168576068:role/ChecksOpsCursorCloudTrailCwLogsTemp",
              "arn:aws:iam::806168576068:role/checksops-production-api-execution"
            ]
          },
          {
            "Sid": "DenySecurityMonitoringAndJobs",
            "Effect": "Deny",
            "Action": [
              "cloudtrail:*",
              "config:*",
              "guardduty:*",
              "securityhub:*",
              "events:*",
              "scheduler:*",
              "synthetics:*",
              "sns:*"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenySensitiveBucketsAndSpa",
            "Effect": "Deny",
            "Action": "s3:*",
            "Resource": "*"
          },
          {
            "Sid": "DenyKmsAndRoleChaining",
            "Effect": "Deny",
            "Action": [
              "kms:*",
              "sts:AssumeRole",
              "sts:AssumeRoleWithSAML",
              "sts:AssumeRoot"
            ],
            "Resource": "*"
          },
          {
            "Sid": "DenyProtectedCloudFormation",
            "Effect": "Deny",
            "Action": [
              "cloudformation:CreateStack",
              "cloudformation:UpdateStack",
              "cloudformation:DeleteStack",
              "cloudformation:CreateChangeSet",
              "cloudformation:ExecuteChangeSet"
            ],
            "Resource": [
              "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-prep-api/*",
              "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-cloudfront-waf/*",
              "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-*"
            ]
          }
        ]
      }

  OriginVerifyExecutionRole:
    Type: AWS::IAM::Role
    Condition: ShouldDeployRole
    Properties:
      RoleName: checksops-production-origin-verify
      Description: Execution role for origin-verify authorizer Lambda only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: origin-verify-secret-and-logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AuthorizerLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - arn:aws:logs:us-east-1:806168576068:log-group:/aws/lambda/checksops-production-origin-verify
                  - arn:aws:logs:us-east-1:806168576068:log-group:/aws/lambda/checksops-production-origin-verify:*
              - Sid: OriginVerifySecretRead
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: arn:aws:secretsmanager:us-east-1:806168576068:secret:checksops/production/cloudfront-origin-verify*
      Tags:
        - Key: Purpose
          Value: cloudfront-origin-verify

  ApiPerimeterStep3Role:
    Type: AWS::IAM::Role
    Condition: ShouldDeployRole
    Properties:
      RoleName: !Ref RoleName
      Description: TEMPORARY Cursor OIDC role for Step 3 origin-verify only.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CursorCloudOidcLiveApiCursorCom
            Effect: Allow
            Principal:
              Federated: arn:aws:iam::806168576068:oidc-provider/api.cursor.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                api.cursor.com:aud: sts.amazonaws.com
                api.cursor.com:sub: user:325724407
      ManagedPolicyArns:
        - !Ref AllowPolicy
        - !Ref DenyPolicy
      Tags:
        - Key: Temporary
          Value: "true"
        - Key: Purpose
          Value: api-perimeter-step-3
        - Key: DoNotBroadenStaging
          Value: "true"
        - Key: DoNotBroadenSteps12Temp
          Value: "true"
        - Key: DoNotRecreateDeletedHardeningRoles
          Value: "true"

Outputs:
  DoNotDeployFromThisPr:
    Value: STOP FOR REVIEW. DeployRole default false. Do not create this role yet.
  RoleName:
    Condition: ShouldDeployRole
    Value: !Ref ApiPerimeterStep3Role
  RoleArn:
    Condition: ShouldDeployRole
    Value: !GetAtt ApiPerimeterStep3Role.Arn
  AuthorizerExecutionRoleArn:
    Condition: ShouldDeployRole
    Value: !GetAtt OriginVerifyExecutionRole.Arn
