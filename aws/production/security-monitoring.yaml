AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Detection-only production security monitoring (Hardening Batch 5).
  AWS Config, CloudTrail (management events), and VPC Flow Logs.
  CloudWatch alarms, GuardDuty, Security Hub, and SNS are operator
  templates because the agent role cannot PutMetricAlarm, TagResource,
  or call SNS. Does not block application traffic. Does not enable
  money/provider flags. Does not attach WAF. Does not delete bridges.

Parameters:
  VpcId:
    Type: String
    Default: vpc-09f2268778966ce97
  SecurityLogsBucketName:
    Type: String
    Default: checksops-production-security-logs-806168576068
  ConfigRoleArn:
    Type: String
    Default: arn:aws:iam::806168576068:role/checksops-production-config-recorder
    Description: Existing Config recorder role. Do not recreate or delete.

Resources:
  SecurityLogsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref SecurityLogsBucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: retain-365
            Status: Enabled
            ExpirationInDays: 365
            Prefix: ''
  SecurityLogsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SecurityLogsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:GetBucketLocation
            Resource: !GetAtt SecurityLogsBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${SecurityLogsBucket.Arn}/cloudtrail/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSConfigAclCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource: !GetAtt SecurityLogsBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceAccount: !Ref AWS::AccountId
          - Sid: AWSConfigWrite
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${SecurityLogsBucket.Arn}/config/AWSLogs/${AWS::AccountId}/*
            Condition:
              StringEquals:
                s3:x-amz-acl: bucket-owner-full-control
                AWS:SourceAccount: !Ref AWS::AccountId

  CloudTrailLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/cloudtrail/checksops-production-management
      RetentionInDays: 365

  CloudTrailLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: checksops-production-cloudtrail-logs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteCloudTrailLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub ${CloudTrailLogGroup.Arn}:*

  ProductionCloudTrail:
    Type: AWS::CloudTrail::Trail
    DependsOn:
      - SecurityLogsBucketPolicy
      - CloudTrailLogsRole
    Properties:
      TrailName: checksops-production-management
      S3BucketName: !Ref SecurityLogsBucket
      S3KeyPrefix: cloudtrail
      IsLogging: true
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      EnableLogFileValidation: true
      CloudWatchLogsLogGroupArn: !Sub '${CloudTrailLogGroup.Arn}:*'
      CloudWatchLogsRoleArn: !GetAtt CloudTrailLogsRole.Arn
      EventSelectors:
        - IncludeManagementEvents: true
          ReadWriteType: All

  IamChangeMetricFilter:
    Type: AWS::Logs::MetricFilter
    DependsOn: ProductionCloudTrail
    Properties:
      LogGroupName: !Ref CloudTrailLogGroup
      FilterName: checksops-prod-iam-security-changes
      FilterPattern: >-
        { ($.eventSource = iam.amazonaws.com) &&
        ($.eventName = CreateUser || $.eventName = DeleteUser ||
        $.eventName = CreateAccessKey || $.eventName = DeleteAccessKey ||
        $.eventName = UpdateAccessKey || $.eventName = PutUserPolicy ||
        $.eventName = AttachUserPolicy || $.eventName = AttachRolePolicy ||
        $.eventName = PutRolePolicy || $.eventName = UpdateAssumeRolePolicy ||
        $.eventName = CreateLoginProfile || $.eventName = UpdateLoginProfile) }
      MetricTransformations:
        - MetricNamespace: ChecksOps/ProductionPrep
          MetricName: IamSecurityChanges
          MetricValue: '1'
          DefaultValue: 0

  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    DependsOn: SecurityLogsBucketPolicy
    Properties:
      Name: checksops-production
      S3BucketName: !Ref SecurityLogsBucket
      S3KeyPrefix: config

  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    DependsOn: ConfigDeliveryChannel
    Properties:
      Name: checksops-production
      RoleARN: !Ref ConfigRoleArn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vpc/checksops-production-flow
      RetentionInDays: 90

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: checksops-production-vpc-flow-logs
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFlowLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn

  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VpcId
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      MaxAggregationInterval: 600

Outputs:
  SecurityLogsBucketName:
    Value: !Ref SecurityLogsBucket
  CloudTrailName:
    Value: !Ref ProductionCloudTrail
  OperatorSnsTopicName:
    Value: checksops-production-security-alerts
  FlowLogGroup:
    Value: !Ref FlowLogGroup
  DetectionOnly:
    Value: 'true'
  MoneyFlagsUnchanged:
    Value: 'true'
