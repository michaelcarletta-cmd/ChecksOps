AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Production CloudFront WAFv2 for checksops.com. Common and KnownBadInputs managed
  rule groups enforce their native AWS actions after monitored production evidence
  showed exploit and secret-file probes. IP reputation and general rate limiting
  remain COUNT for further observation. Path rate limits for /auth /storage /public
  remain BLOCK at conservative ceilings. Do not attach to staging.

Resources:
  ProductionCloudFrontWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: checksops-production-cloudfront-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: checksopsProductionCloudFrontWaf
      Rules:
        - Name: AWSManagedCommonEnforce
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedCommonEnforce
        - Name: AWSManagedKnownBadInputsEnforce
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedKnownBadInputsEnforce
        - Name: AWSManagedIpReputationCount
          Priority: 2
          OverrideAction:
            Count: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AWSManagedIpReputationCount
        - Name: RateLimitGeneralCount
          Priority: 10
          Action:
            Count: {}
          Statement:
            RateBasedStatement:
              Limit: 2000
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitGeneralCount
        - Name: RateLimitAuth
          Priority: 20
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 100
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /auth
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
                  PositionalConstraint: CONTAINS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitAuth
        - Name: RateLimitStorage
          Priority: 21
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /storage
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
                  PositionalConstraint: CONTAINS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitStorage
        - Name: RateLimitPublic
          Priority: 22
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: 200
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  SearchString: /public
                  FieldToMatch:
                    UriPath: {}
                  TextTransformations:
                    - Priority: 0
                      Type: LOWERCASE
                  PositionalConstraint: CONTAINS
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPublic

Outputs:
  WebACLArn:
    Value: !GetAtt ProductionCloudFrontWebACL.Arn
  WebACLId:
    Value: !GetAtt ProductionCloudFrontWebACL.Id
