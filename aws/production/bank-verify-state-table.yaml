AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Recipient bank-verify durable state table only. Apply as its own stack
  (checksops-recipient-bank-verify-state). Do not update the prep API stack.
  No money flags. No Lambda code change required by this template.

Resources:
  RecipientBankVerifyStateTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: checksops-recipient-bank-verify-state
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      DeletionProtectionEnabled: true
      Tags:
        - Key: Environment
          Value: production-prep
        - Key: Purpose
          Value: recipient-bank-verify-state
      ResourcePolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowPrepApiLambdaLeastPrivilege
            Effect: Allow
            Principal:
              AWS:
                - arn:aws:iam::806168576068:role/checksops-production-api-execution
                - arn:aws:iam::806168576068:role/checksops-production-prep-api-role
            Action:
              - dynamodb:GetItem
              - dynamodb:PutItem
              - dynamodb:UpdateItem
              - dynamodb:DescribeTable
            Resource: !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/checksops-recipient-bank-verify-state

Outputs:
  TableName:
    Value: checksops-recipient-bank-verify-state
  TableArn:
    Value: !GetAtt RecipientBankVerifyStateTable.Arn
