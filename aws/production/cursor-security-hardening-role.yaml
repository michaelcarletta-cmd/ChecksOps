AWSTemplateFormatVersion: '2010-09-09'
Description: >
  TEMPORARY Cursor Cloud OIDC role for Security Hardening deployments #2-#6.
  Customer-managed policies (not role inline) because IAM enforces a 10240-byte
  AGGREGATE inline-policy quota per role. Each managed policy is under the
  6144-character customer-managed limit. Same reviewed Allow/Deny statements.
  Live trust: api.cursor.com / aud sts.amazonaws.com / sub user:325724407.
  Role has zero inline policies. Stack owns the role and all six managed
  policies so delete-stack removes them together.
  Does not broaden ChecksOpsCursorCloudStaging. Do not deploy until reviewed.
  Do not start #2-#6 from this template create.

Resources:
  AllowCfnSnsPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ChecksOpsCursorSecHardAllowCfnSns
      Description: TEMPORARY allow CFN stacks #2-#6 and SNS alerts. Delete with stack.
      PolicyDocument: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "CfnReadAccountStacks",
              "Effect": "Allow",
              "Action": [
                "cloudformation:ListStacks",
                "cloudformation:DescribeStacks",
                "cloudformation:DescribeStackEvents",
                "cloudformation:DescribeStackResources",
                "cloudformation:DescribeStackResource",
                "cloudformation:ListStackResources",
                "cloudformation:GetTemplate",
                "cloudformation:GetTemplateSummary",
                "cloudformation:ValidateTemplate"
              ],
              "Resource": "*"
            },
            {
              "Sid": "CfnMutateOnlyDeployments2to6",
              "Effect": "Allow",
              "Action": [
                "cloudformation:CreateStack",
                "cloudformation:UpdateStack",
                "cloudformation:DeleteStack",
                "cloudformation:CreateChangeSet",
                "cloudformation:DescribeChangeSet",
                "cloudformation:ExecuteChangeSet",
                "cloudformation:DeleteChangeSet",
                "cloudformation:GetTemplate",
                "cloudformation:GetTemplateSummary",
                "cloudformation:DescribeStackEvents",
                "cloudformation:DescribeStackResources",
                "cloudformation:DescribeStackResource",
                "cloudformation:ListStackResources"
              ],
              "Resource": [
                "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-sns/*",
                "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-config/*",
                "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-posture/*",
                "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-flow/*",
                "arn:aws:cloudformation:us-east-1:806168576068:stack/checksops-production-security-alarms/*",
                "arn:aws:cloudformation:us-east-1:806168576068:changeSet/*"
              ]
            },
            {
              "Sid": "SnsSecurityAlertTopic",
              "Effect": "Allow",
              "Action": [
                "sns:CreateTopic",
                "sns:DeleteTopic",
                "sns:SetTopicAttributes",
                "sns:GetTopicAttributes",
                "sns:ListTagsForResource",
                "sns:TagResource",
                "sns:UntagResource",
                "sns:Subscribe",
                "sns:Unsubscribe",
                "sns:ListSubscriptionsByTopic",
                "sns:GetSubscriptionAttributes",
                "sns:SetSubscriptionAttributes"
              ],
              "Resource": "arn:aws:sns:us-east-1:806168576068:checksops-production-security-alerts"
            }
          ]
        }

  AllowConfigPosturePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: ChecksOpsCursorSecHardAllowConfigPosture
      Description: TEMPORARY allow Config and GuardDuty/Security Hub. Delete with stack.
      PolicyDocument: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "ConfigRecorderNoNewRole",
              "Effect": "Allow",
              "Action": [
                "config:PutDeliveryChannel",
                "config:DeleteDeliveryChannel",
                "config:DescribeDeliveryChannels",
                "config:DescribeDeliveryChannelStatus",
                "config:PutConfigurationRecorder",
                "config:DeleteConfigurationRecorder",
                "config:DescribeConfigurationRecorders",
                "config:DescribeConfigurationRecorderStatus",
                "config:StartConfigurationRecorder",
                "config:StopConfigurationRecorder",
                "config:GetStatus"
              ],
              "Resource": "*"
            },
            {
              "Sid": "PassExistingConfigRecorderRole",
              "Effect": "Allow",
              "Action": "iam:PassRole",
              "Resource": "arn:aws:iam::806168576068:role/checksops-production-config-items-recorder",
              "Condition": {
                "StringEquals": {
                  "iam:PassedToService": "config.amazonaws.com"
                }
              }
            },
            {
              "Sid": "ReadConfigRecorderRole",
              "Effect": "Allow",
              "Action": [
                "iam:GetRole",
                "iam:GetRolePolicy",
                "iam:ListRolePolicies",
                "iam:ListAttachedRolePolicies"
              ],
              "Resource": "arn:aws:iam::806168576068:role/checksops-production-config-items-recorder"
            },
            {
              "Sid": "GuardDutyDetector",
              "Effect": "Allow",
              "Action": [
                "guardduty:CreateDetector",
                "guardduty:DeleteDetector",
                "guardduty:GetDetector",
                "guardduty:ListDetectors",
                "guardduty:UpdateDetector",
                "guardduty:TagResource",
                "guardduty:UntagResource",
                "guardduty:ListTagsForResource",
                "guardduty:ListFindings"
              ],
              "Resource": "*"
            },
            {
              "Sid": "SecurityHubHubAndStandards",
              "Effect": "Allow",
              "Action": [
                "securityhub:EnableSecurityHub",
                "securityhub:DisableSecurityHub",
                "securityhub:DescribeHub",
                "securityhub:UpdateSecurityHubConfiguration",
                "securityhub:GetEnabledStandards",
                "securityhub:DescribeStandards",
                "securityhub:BatchEnableStandards",
                "securityhub:BatchDisableStandards",
                "securityhub:TagResource",
                "securityhub:UntagResource",
                "securityhub:ListTagsForResource",
                "securityhub:GetFindings"
              ],
              "Resource": "*"
            },
            {
              "Sid": "CreateDetectionServiceLinkedRoles",
              "Effect": "Allow",
              "Action": "iam:CreateServiceLinkedRole",
              "Resource": "*",
              "Condition": {
                "StringEquals": {
                  "iam:AWSServiceName": [
                    "guardduty.amazonaws.com",
                    "securityhub.amazonaws.com",
                    "config.amazonaws.com"
                  ]
                }
              }
            }
          ]
        }

