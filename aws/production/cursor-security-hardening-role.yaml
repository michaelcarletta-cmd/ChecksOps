  ChecksOpsCursorSecurityHardeningTemp:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ChecksOpsCursorSecurityHardeningTemp
      Description: TEMPORARY Cursor OIDC role for Security Hardening #2-#6. Delete after PASS. Cannot set Lambda money/provider flags.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument: {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "CursorCloudOidcLiveApiCursorCom",
              "Effect": "Allow",
              "Principal": {
                "Federated": "arn:aws:iam::806168576068:oidc-provider/api.cursor.com"
              },
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Condition": {
                "StringEquals": {
                  "api.cursor.com:aud": "sts.amazonaws.com",
                  "api.cursor.com:sub": "user:325724407"
                }
              }
            }
          ]
        }
      ManagedPolicyArns:
        - !Ref AllowCfnSnsPolicy
        - !Ref AllowConfigPosturePolicy
        - !Ref AllowFlowAlarmsPolicy
        - !Ref AllowReadonlyPolicy
        - !Ref DenyFinancialAppPolicy
        - !Ref DenyIamInfraPolicy
      Tags:
        - Key: Purpose
          Value: SecurityHardeningDeployments2to6
        - Key: Temporary
          Value: 'true'
        - Key: ManagedBy
          Value: operator-console
        - Key: DoNotUseForFinancial
          Value: 'true'
        - Key: DoNotBroadenStagingRole
          Value: ChecksOpsCursorCloudStaging

Outputs:
  RoleName:
    Value: ChecksOpsCursorSecurityHardeningTemp
  RoleArn:
    Value: !GetAtt ChecksOpsCursorSecurityHardeningTemp.Arn
  MaxSessionSeconds:
    Value: '3600'
  TrustIssuer:
    Value: api.cursor.com
  ManagedPolicyCount:
    Value: '6'
  RoleInlinePolicyCount:
    Value: '0'
  CustomerManagedPolicyLimitChars:
    Value: '6144'
  RoleAggregateInlinePolicyLimitChars:
    Value: '10240'
  DoNotAttachToStagingRole:
    Value: ChecksOpsCursorCloudStaging
