AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Dedicated ChecksOps production API/Lambda execution role (Hardening Batch 1).
  Least privilege for RDS app secret, private files bucket, VPC ENI, and logs.
  Does not grant staging provider/sandbox secrets or the RDS admin secret.
  Cognito admin is limited to tenant-invite-user on the production ChecksOps pool.

Parameters:
  RoleName:
    Type: String
    Default: checksops-production-api-execution
  FilesBucketName:
    Type: String
    Default: checksops-staging-privatefilesbucket-erzqsolpucjp
  AppDatabaseSecretArn:
    Type: String
    Default: arn:aws:secretsmanager:us-east-1:806168576068:secret:rds-db-credentials/checksops-staging/checksops/1788286468693-b4U0Rn
    Description: Application DB secret only. Never the RDS admin secret or staging providers secret.
  ProductionUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:us-east-1:806168576068:userpool/us-east-1_h00WorYMT
    Description: Production ChecksOps user pool only. Do not point at staging or any other pool.

Resources:
  ProductionApiExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      Description: Dedicated production API execution. No staging provider secrets.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
        - arn:aws:iam::aws:policy/AWSXrayWriteOnlyAccess
      Policies:
        - PolicyName: ProductionApiLeastPrivilege
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: AppDatabaseSecretRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref AppDatabaseSecretArn
              - Sid: PrivateCheckImageBucket
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketLocation
                  - s3:ListBucket
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                  - s3:AbortMultipartUpload
                Resource:
                  - !Sub arn:aws:s3:::${FilesBucketName}
                  - !Sub arn:aws:s3:::${FilesBucketName}/*
              - Sid: TenantInviteUserProductionCognito
                Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                Resource: !Ref ProductionUserPoolArn
      Tags:
        - Key: Environment
          Value: production
        - Key: HardeningBatch
          Value: '1'
        - Key: DoNotGrantProviderSecrets
          Value: 'true'

Outputs:
  ExecutionRoleArn:
    Value: !GetAtt ProductionApiExecutionRole.Arn
  ExecutionRoleName:
    Value: !Ref ProductionApiExecutionRole
