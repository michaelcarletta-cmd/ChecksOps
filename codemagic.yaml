# Codemagic builds for the ChecksOps iOS and Android apps (Capacitor shell in mobile/).
#
# No triggering section: every build is started by hand in Codemagic. Nothing here touches
# AWS, the database or the website; the builds read the repo, build the website bundle and
# package it into the apps. The *-staging workflows build against staging (.env.aws.example);
# the *-production workflows build against production (the production Cognito pool and
# https://checksops.com/prep, public identifiers only). Both ship as com.checksops.app, so the
# last build installed is the one on the phone.
#
# Set up once in the Codemagic UI before the first build:
#   - Team integrations > Developer Portal: an App Store Connect API key named "ChecksOps".
#   - Code signing identities > iOS: let Codemagic fetch an App Store profile for com.checksops.app.
#   - Code signing identities > Android keystores: an upload keystore with reference "checksops_upload".
#   - Environment variables, group "google_play": GCLOUD_SERVICE_ACCOUNT_CREDENTIALS (a Play
#     Console service account JSON, marked secure).
# Google Play accepts API uploads only after the first AAB has been uploaded by hand in the
# Play Console, so take the AAB from an android-staging-build run and upload it there; after
# that, android-staging uploads each build to the internal track.

definitions:
  scripts:
    - &install_bun
      name: Install bun (the version CI uses)
      script: |
        curl -fsSL https://bun.sh/install | bash -s "bun-v1.4.2"
        echo "PATH=$HOME/.bun/bin:$PATH" >> "$CM_ENV"
    - &build_web
      name: Build the staging website bundle
      script: |
        bun install --frozen-lockfile
        cp .env.aws.example .env.aws
        bun run build:aws
    - &build_web_production
      name: Build the production website bundle
      # The app is served from capacitor://localhost (iOS) or https://localhost (Android), so the
      # API is the full https://checksops.com/prep address, not the website's same-origin /prep.
      # Same public Cognito values as the guarded production website upload.
      # Push is on for iOS only (APNs key stored 2026-11-21); Android waits for Firebase
      # (google-services.json), because registering without it crashes the app.
      script: |
        bun install --frozen-lockfile
        cat > .env.aws <<'ENV'
        VITE_AUTH_PROVIDER=cognito
        VITE_APP_URL=https://checksops.com
        VITE_CHECKSOPS_API_URL=https://checksops.com/prep
        VITE_AWS_REGION=us-east-1
        VITE_COGNITO_USER_POOL_ID=us-east-1_h00WorYMT
        VITE_COGNITO_USER_POOL_CLIENT_ID=3ja9fqaq2fjkv3i6up2varcqpe
        VITE_NATIVE_PUSH_PLATFORMS=ios
        ENV
        CHECKSOPS_NATIVE_APP_BUILD=1 bun run build:aws
    - &install_capacitor
      name: Install Capacitor
      script: npm ci --prefix mobile

workflows:
  # Build only, no Play upload: works before the Play Console account exists. The signed APK
  # installs directly on an Android phone; the AAB is the file for the first manual Play upload.
  android-staging-build:
    name: Android (staging, build only)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - checksops_upload
    scripts:
      - *install_bun
      - *build_web
      - *install_capacitor
      - name: Copy the website into the Android project
        script: cd mobile && npx cap sync android
      - name: Build the signed APK and Android App Bundle
        script: |
          cd mobile/android
          ./gradlew assembleRelease bundleRelease -PversionCode="$PROJECT_BUILD_NUMBER"
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
      - mobile/android/app/build/outputs/**/*.aab

  android-staging:
    name: Android (staging)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - checksops_upload
      groups:
        - google_play
    scripts:
      - *install_bun
      - *build_web
      - *install_capacitor
      - name: Copy the website into the Android project
        script: cd mobile && npx cap sync android
      - name: Build the signed Android App Bundle
        script: |
          cd mobile/android
          ./gradlew bundleRelease -PversionCode="$PROJECT_BUILD_NUMBER"
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-staging:
    name: iOS (staging)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ChecksOps
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.checksops.app
    scripts:
      - *install_bun
      - *build_web
      - *install_capacitor
      - name: Copy the website into the iOS project
        script: cd mobile && npx cap sync ios
      - name: Apply the signing profile
        script: xcode-project use-profiles
      - name: Build the signed IPA
        # CURRENT_PROJECT_VERSION feeds CFBundleVersion. PROJECT_BUILD_NUMBER counts builds across
        # every workflow of this Codemagic app, so staging and production uploads of
        # com.checksops.app never reuse a number (the per-workflow BUILD_NUMBER did).
        # On failure, print Xcode's own error lines (Codemagic only reports "Failed to archive")
        # and keep the full xcodebuild log as an artifact.
        script: |
          if ! xcode-project build-ipa \
            --project mobile/ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"; then
            echo "Xcode errors from /tmp/xcodebuild_logs:"
            grep -h -E "error:|Provisioning profile|entitlement|Code Signing Error|requires a provisioning profile" /tmp/xcodebuild_logs/*.log | sort -u | head -80 || true
            exit 65
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Upload only. Internal testers see each build in TestFlight once Apple has processed it;
        # submitting to beta review is for external testers and needs the beta review details
        # filled in App Store Connect first.
        submit_to_testflight: false

  android-production:
    name: Android (production)
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      node: 22
      java: 21
      android_signing:
        - checksops_upload
      groups:
        - google_play
    scripts:
      - *install_bun
      - *build_web_production
      - *install_capacitor
      - name: Copy the website into the Android project
        script: cd mobile && npx cap sync android
      - name: Build the signed Android App Bundle
        script: |
          cd mobile/android
          ./gradlew bundleRelease -PversionCode="$PROJECT_BUILD_NUMBER"
    artifacts:
      - mobile/android/app/build/outputs/**/*.aab
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        track: internal
        submit_as_draft: true

  ios-production:
    name: iOS (production)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ChecksOps
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.checksops.app
    scripts:
      - *install_bun
      - *build_web_production
      - *install_capacitor
      - name: Copy the website into the iOS project
        script: cd mobile && npx cap sync ios
      - name: Apply the signing profile
        script: xcode-project use-profiles
      - name: Build the signed IPA
        # On failure, print Xcode's own error lines (Codemagic only reports "Failed to archive")
        # and keep the full xcodebuild log as an artifact.
        script: |
          if ! xcode-project build-ipa \
            --project mobile/ios/App/App.xcodeproj \
            --scheme App \
            --archive-xcargs "COMPILER_INDEX_STORE_ENABLE=NO CURRENT_PROJECT_VERSION=$PROJECT_BUILD_NUMBER"; then
            echo "Xcode errors from /tmp/xcodebuild_logs:"
            grep -h -E "error:|Provisioning profile|entitlement|Code Signing Error|requires a provisioning profile" /tmp/xcodebuild_logs/*.log | sort -u | head -80 || true
            exit 65
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
